<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>多维表分析</title>
<style>
  :root{
    --accent:#3370FF; --accent-dark:#173A8C; --accent-weak:#E8F0FE; --accent-weak2:#E1EAFF;
    --border:#E5E6EB; --border-strong:#C9CDD4; --text:#1D2129; --text-2:#4E5969;
    --text-3:#86909C; --bg:#FFFFFF; --bg-2:#F7F8FA; --bg-3:#F2F3F5;
    --hover:#F2F3F5; --danger:#F53F3F; --ok:#00B42A; --radius:6px;
    --bar:#3370FF,#14C9C9,#FF7D00,#F76965,#9FDB60,#CA62E8,#FFC53D,#6E4AE0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:13px;color:var(--text);background:var(--bg);overflow:hidden;
  }
  #app{display:flex;flex-direction:column;height:100vh;}
  .btn{height:26px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--bg);color:var(--text);cursor:pointer;font-size:12px;line-height:1;display:inline-flex;align-items:center;gap:4px;}
  .btn .ic{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;}
  .btn .ic svg{width:14px;height:14px;}
  .btn:hover{background:var(--hover);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{filter:brightness(0.96);}
  .btn.ghost{border-color:transparent;color:var(--text-2);}
  .btn.sm{height:24px;padding:0 9px;font-size:12px;}
  .btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  /* 文本选中高亮使用品牌蓝，贴合整体风格（#306） */
  ::selection{background:var(--accent);color:#fff;}
  /* 主体 */
  .body{display:flex;flex:1;min-height:0;}
  .sidebar{width:115px;flex:0 0 auto;border-right:1px solid var(--border);background:var(--bg-2);
    display:flex;flex-direction:column;padding:6px 6px;overflow:auto;}
  .sidebar-brand{display:flex;align-items:center;gap:6px;height:32px;padding:0 6px 6px;border-bottom:1px solid var(--border);margin-bottom:6px;font-weight:600;font-size:13px;color:var(--text);white-space:nowrap;}
  .sidebar-brand .dot{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--accent-dark);flex:0 0 auto;}
  .sidebar-top{display:flex;flex-direction:column;gap:6px;padding:0 2px 8px;border-bottom:1px solid var(--border);margin-bottom:6px;}
  .sidebar-top .table-select{height:26px;border:1px solid var(--border);border-radius:var(--radius);padding:0 6px;width:100%;color:var(--text);background:var(--bg);font-size:12px;}
  .sidebar-top .btn{width:100%;justify-content:center;}
  /* 功能区(ribbon)图标统一使用深蓝色 */
  .sidebar-top .btn .ic{color:var(--accent-dark);}
  .sidebar .group-title{font-size:12px;color:var(--text-3);padding:4px 6px;}
  .view-item{position:relative;display:flex;align-items:center;gap:5px;height:30px;padding:0 7px;border-radius:var(--radius);
    cursor:pointer;color:var(--text-2);user-select:none;font-size:14px;font-weight:500;}
  .view-item:hover{background:var(--hover);}
  .view-item.active{background:var(--accent-weak);color:var(--accent);font-weight:600;}
  .view-item .ic{width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);}
  .view-item .ic svg{width:14px;height:14px;}
  /* 视图切换图标及文字使用强调蓝（自带视图） */
  .view-item .vname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;color:var(--accent);}
  /* 用户另存的新视图：名称与图标不显示强调色，仅以 .view-sep 分隔线与自带视图区分 */
  .view-item.user .ic{color:var(--text-2);}
  .view-item.user .vname{color:var(--text-2);}
  .view-item.user.active .ic{color:var(--accent);}
  .view-item.user.active .vname{color:var(--accent);}
  .sidebar .add-view{margin-top:4px;color:var(--text-3);}
  /* 自带视图与用户创建视图之间的分隔线 */
  .view-sep{height:1px;background:var(--border);margin:4px 7px;}
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .viewbar{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-bottom:1px solid var(--border);flex:0 0 auto;}
  .viewbar .vtabs{display:flex;gap:2px;flex:1;overflow:auto;}
  .vtab{height:26px;padding:0 10px;border-radius:var(--radius);cursor:pointer;color:var(--text-2);
    display:inline-flex;align-items:center;white-space:nowrap;font-size:12px;}
  .vtab:hover{background:var(--hover);}
  .vtab.active{background:var(--accent-weak);color:var(--accent);font-weight:600;}
  .viewbar .tools{display:flex;gap:6px;align-items:center;}
  .search{height:26px;border:1px solid var(--border);border-radius:var(--radius);padding:0 8px;width:160px;font-size:12px;}
  .content{flex:1;min-height:0;overflow:hidden;position:relative;}
  .stage{flex:1;display:flex;min-height:0;min-width:0;}
  .detail-panel{width:100%;border-left:none;background:var(--bg-2);overflow:auto;display:none;min-height:0;}
  .detail-panel.open{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;}
  .right-col{flex:0 0 340px;width:340px;display:flex;flex-direction:column;min-height:0;min-width:0;border-left:1px solid var(--border);background:var(--bg-2);}
  .right-col:not(.has-panel){flex-basis:0;width:0;border-left:none;}
  .search-results{display:none;flex:0 0 auto;max-height:42%;overflow:auto;border-bottom:1px solid var(--border);}
  .search-results.open{display:block;}
  .sr-head{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-size:12px;font-weight:600;color:var(--text-2);border-bottom:1px solid var(--border);}
  .sr-item{padding:6px 10px;font-size:12px;cursor:pointer;border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sr-item:hover{background:var(--accent-weak2);}
  .sr-item.selected{background:var(--accent-weak);}
  .dp-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--border);font-weight:600;font-size:13px;position:sticky;top:0;background:var(--bg-2);z-index:2;}
  .dp-body{flex:1;padding:10px 12px;overflow:auto;}
  .dp-foot{padding:10px 12px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
  .detail-panel .form-field{align-items:flex-start;}
  .detail-panel .form-field .ctrl input[type=checkbox],#settingsPanel .form-field .ctrl input[type=checkbox]{width:16px;height:16px;margin:0;}
  /* 表格 */
  .table-wrap{height:100%;overflow:auto;position:relative;}
  table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed;width:auto;}
  table.grid th,table.grid td{border-right:1px solid var(--border);border-bottom:1px solid var(--border);
    padding:0 9px;height:28px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;vertical-align:middle;font-size:12px;}
  table.grid thead th{position:sticky;top:0;z-index:3;background:var(--bg-2);color:var(--text-2);font-weight:600;
    border-bottom:1px solid var(--border-strong);user-select:none;}
  table.grid tbody tr:nth-child(even){background:var(--bg-2);}
  table.grid tbody tr:hover{background:var(--accent-weak2);}
  table.grid tbody tr.selected{background:var(--accent-weak);}
  table.grid tfoot td{background:var(--bg-2);border-top:2px solid var(--accent);border-right:1px solid var(--border);padding:4px 6px;font-size:11px;}
  table.grid.sticky-summary tfoot td{position:sticky;bottom:0;z-index:2;}
  table.grid tfoot td.col-rownum{font-weight:600;color:var(--text-2);}
  .summary-row .sum-val{font-weight:600;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;}
  .summary-mode{width:100%;height:22px;font-size:11px;border:1px solid var(--border);border-radius:4px;background:#fff;padding:0 2px;}
  .col-rownum{min-width:34px;text-align:center;color:var(--text-3);background:var(--bg-2);}
  .col-actions{min-width:34px;max-width:50px;text-align:center;}
  .num{text-align:right;}
  th .th-inner{display:flex;align-items:center;gap:4px;position:relative;}
  th .sort{cursor:pointer;color:var(--text-3);}
  th .sort.asc,th .sort.desc{color:var(--accent);}
  th .resizer{position:absolute;right:-2px;top:0;width:6px;height:100%;cursor:col-resize;z-index:4;}
  th .resizer:hover{background:var(--accent);opacity:.4;}
  .cell-edit{width:100%;height:24px;border:1px solid var(--accent);border-radius:4px;padding:0 6px;font:inherit;color:var(--text);background:#fff;}
  .cell-edit:focus{outline:none;background:var(--accent-weak2);box-shadow:0 0 0 3px var(--accent-weak);}
  .cell-edit.date-edit{accent-color:#3370FF;}
  select.cell-edit{padding-right:20px;}
  .cell-check{display:inline-flex;align-items:center;justify-content:center;}
  .row-del{color:var(--text-3);cursor:pointer;visibility:hidden;}
  tr:hover .row-del{visibility:visible;}
  .row-del:hover{color:var(--danger);}
  /* 表单视图 */
  .form-wrap{height:100%;overflow:auto;padding:14px 18px;}
  .form-nav{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;}
  .form-nav .btn{flex:0 0 auto;}
  .form-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:6px 4px 12px;max-width:720px;width:100%;}
  .form-row{display:flex;align-items:flex-start;gap:10px;padding:7px 10px;border-bottom:1px solid var(--bg-3);}
  .form-row:last-child{border-bottom:none;}
  .form-row .flabel{flex:0 0 100px;width:100px;color:var(--text-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:10px;line-height:28px;}
  .form-row .fval{flex:1;min-width:180px;max-width:none;border-radius:4px;padding:3px 0;background:#fff;border:1px solid transparent;}
  .form-row .fval:hover{border-color:var(--accent-weak);}
  .form-row .fval.empty{color:var(--text-3);}
  .form-row .fval .cell-edit{width:100%;height:28px;}
  .form-row .fval textarea.cell-edit:not(.auto-height){height:60px;resize:vertical;}
  .form-row:last-child{border-bottom:none;}
  .form-row.form-actions-row{padding-bottom:0;border-bottom:none;}
  .form-actions{width:100%;display:flex;justify-content:flex-end;gap:8px;padding:0;}
  /* 看板 */
  .kanban-wrap{height:100%;display:flex;flex-direction:column;}
  .kanban-cols{display:flex;gap:10px;height:100%;overflow:auto;padding:10px;}
  .kanban-col{flex:0 0 240px;display:flex;flex-direction:column;background:var(--bg-2);border-radius:8px;min-height:0;overflow:hidden;}
  .kanban-col-head{display:flex;align-items:center;gap:6px;padding:8px 10px;font-weight:600;border-bottom:1px solid var(--border);}
  .kanban-col-head .cnt{color:var(--text-3);font-weight:400;font-size:12px;}
  .kanban-col-body{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:8px;}
  /* #465 分组列内卡片禁止 flex 压缩：列高被 kanban-wrap 固定后，flex item 默认 flex-shrink:1 会按列内卡片数
     等比压扁卡片，造成"不同分组下画册控件高度不统一"；改 flex:0 0 auto 保持与不分组时相同的自然高度，
     内容超出列高时由 .kanban-col-body 的 overflow:auto 出垂直滚动条承载 */
  .kanban-col-body>.kanban-card,.kanban-col-body>.gallery-card{flex:0 0 auto;}
  .kanban-card{background:#fff;border:1px solid var(--border);border-radius:6px;padding:8px 10px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .kanban-card:hover{border-color:var(--accent);}
  .kanban-card.dragging{opacity:.65;box-shadow:0 8px 24px rgba(0,0,0,.15);border-color:var(--accent);background:var(--accent-weak2);}
  body.kanban-dragging, body.kanban-dragging *{user-select:none !important;-webkit-user-select:none !important;cursor:grabbing;}
  .kanban-card.selected{border-color:var(--accent);background:var(--accent-weak2);box-shadow:0 0 0 2px var(--accent);}
  .kanban-card .ktitle{font-weight:600;font-size:12px;margin-bottom:3px;}
  .kanban-card .kdesc{color:var(--text-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kanban-col.dropover{background:var(--accent-weak2);outline:2px dashed var(--accent);outline-offset:-2px;}
  .kanban-col-head{border-top:none;box-shadow:inset 0 3px 0 0 var(--group-color,var(--border));}
  .kanban-col[style*="--group-color"]{background:linear-gradient(to bottom,var(--group-color-bg,#f7f8fa) 0,#f7f8fa 100%);border:1px solid var(--group-color,var(--border));}
  /* 画册 */
  .gallery-grid{height:100%;overflow:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;align-content:start;align-items:start;grid-auto-rows:min-content;}
  .gallery-card{background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-width:200px;}
  .gallery-card.with-img .gbody{padding-bottom:7px;}
  .gallery-card:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(51,112,255,.12);}
  .gallery-card.selected{border-color:var(--accent);background:var(--accent-weak2);box-shadow:0 0 0 2px var(--accent);}
  .gallery-card .gimg{height:120px;flex-shrink:0;width:100%;background:var(--bg-3);display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:12px;overflow:hidden;}
  .gallery-card .gimg img{width:100%;height:100%;object-fit:cover;}
  /* #400 圆形图片显示模式：居中裁剪为圆形，适合人员照片类 */
  .gallery-card .gimg.circle{width:104px;height:104px;border-radius:50%;margin:10px auto 0;background:var(--bg-3);}
  .gallery-card .gimg.circle img{border-radius:50%;}
  /* #402 甘特手动保存模式的浮动“保存调整”条 */
  .gantt-save-bar{position:fixed;right:16px;bottom:16px;z-index:50;background:var(--bg);border:1px solid var(--border);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.14);padding:8px 10px;display:flex;align-items:center;gap:8px;font-size:12px;}
  .gantt-save-bar .gantt-save-txt{color:var(--text-2);}
  .gallery-card .gbody{padding:8px 10px;}
  .gallery-card .gtitle{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gallery-card .gdesc{color:var(--text-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  /* 日历 */
  .calendar-wrap{height:100%;display:flex;flex-direction:column;min-width:0;}
  .calendar-head{display:flex;align-items:center;gap:4px;padding:6px 10px;flex-wrap:nowrap;min-height:40px;min-width:0;}
  .calendar-head .cal-title{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
  .calendar-head .cal-spacer{flex:1;min-width:6px;}
  .calendar-head .btn{flex-shrink:0;white-space:nowrap;}
  .calendar-head .cal-view-btns{display:flex;gap:2px;flex-shrink:0;}
  .calendar-grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:auto repeat(6,minmax(28px,1fr));gap:0;background:#fff;overflow:auto;position:relative;border:1px solid var(--border);align-content:start;min-height:0;} /* #426-2 白底+单元格边框画网格线；#425回归修复 align-content:start 防止 auto 表头行被拉伸成 370px 灰块 + 底部灰边 */
  /* #336 月视图星期表头与周视图列头保持同一格式/字号 */
  .cal-dow{background:var(--bg-2);text-align:center;height:30px;line-height:30px;font-weight:600;font-size:12px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);}
  .cal-cell{background:#fff;padding:4px 6px;overflow:hidden;font-size:12px;position:relative;border-right:1px solid var(--border);border-bottom:1px solid var(--border);}
  .cal-cell.out{background:var(--bg-2);color:var(--text-3);}
  /* #464 周末列填充色改 #F7F7F7（更浅）；跨月周末再浅一档 #EFEFEF */
  .cal-cell.weekend{background:#F7F7F7;}
  .cal-cell.out.weekend{background:#EFEFEF;}
  /* #464 周视图周末列同样填充 #F7F7F7（列体透明继承列背景） */
  .cal-day-col.weekend{background:#F7F7F7;}
  .cal-cell .dnum{font-weight:600;margin-bottom:2px;}
  .cal-cell .dnum .today{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:var(--accent);color:#fff;}
  .cal-event{background:var(--accent-weak);color:var(--accent);border-radius:3px;padding:1px 14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;position:relative;}
  .cal-event:active{cursor:grabbing;}
  /* #419 旧版(::before/::after)边缘伪元素拖拽区已废弃，改用显式 ⟨⟩ 手柄（见上方 .cal-event-resize-*） */
  .cal-event.cal-more{background:transparent;color:var(--text-3);font-size:11px;padding:2px 4px;}
  .week-row{display:flex;border-bottom:1px solid var(--border);}
  .week-day{flex:1;padding:6px;background:var(--bg-2);border-right:1px solid var(--border);font-weight:600;}
  .day-view{padding:14px;}
  .day-head{font-size:18px;font-weight:700;margin-bottom:12px;}
  .cal-timeline{display:flex;flex:1;overflow:auto;min-height:0;position:relative;}
  .cal-time-axis{flex:0 0 46px;border-right:1px solid var(--border);background:var(--bg-2);padding-top:30px;}
  .cal-time-label{height:40px;line-height:40px;text-align:right;padding-right:6px;color:var(--text-3);font-size:11px;}
  .cal-week-cols{display:flex;flex:1;min-width:0;position:relative;}
  .cal-day-col{flex:1;min-width:110px;border-right:1px solid var(--border);position:relative;background:#fff;}
  /* 日视图今天列不再填充底色，仅保留贯穿的当前时间红线 */
  .cal-day-col.today:not(.is-week){}
  .cal-day-col-head{height:30px;line-height:30px;text-align:center;font-weight:600;border-bottom:1px solid var(--border);font-size:12px;background:var(--bg-2);}
  .cal-day-col-body{position:relative;height:960px;overflow:hidden;}
  .cal-slot{position:absolute;left:0;right:0;border-bottom:1px solid var(--bg-3);height:40px;}
  .cal-allday{min-height:32px;border-bottom:1px solid var(--border);background:var(--bg-2);padding:4px;}
  .cal-day-event{position:absolute;left:3px;right:3px;background:var(--accent-weak);color:var(--accent);border-radius:3px;padding:2px 4px;font-size:11px;overflow:hidden;cursor:move;border-left:3px solid var(--accent);user-select:none;line-height:1.25;}
  .cal-day-event:hover{background:#D6E4FF;}
  .cal-day-event.selected{background:var(--accent-weak2);border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);z-index:3;}
  .cal-day-event.allday{position:static;margin-bottom:2px;cursor:pointer;white-space:nowrap;text-overflow:ellipsis;}
  .cal-event.selected{border-color:var(--accent);background:var(--accent-weak2);box-shadow:0 0 0 2px var(--accent);z-index:2;}
  .cal-day-event .evt-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;font-weight:600;}
  .cal-day-event .evt-time{font-size:10px;color:var(--text-2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-event-resize{position:absolute;left:0;right:0;bottom:0;height:6px;cursor:ns-resize;}
  .cal-event-resize:hover{background:rgba(51,112,255,.25);}
  .cal-event-resize-top{position:absolute;left:0;right:0;top:0;height:6px;cursor:ns-resize;}
  .cal-event-resize-top:hover{background:rgba(51,112,255,.25);}
  /* #422 月视图事件改为悬浮分段层：.cal-event-seg 绝对定位覆盖于方格之上（不再嵌入单格文档流），按周分段、泳道堆叠；彻底消除"列宽幻觉"与"释放回弹" */
  .cal-event-seg{position:absolute;height:18px;line-height:18px;background:var(--accent-weak);color:var(--accent);border-radius:3px;padding:0 14px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;box-sizing:border-box;z-index:2;border:1px solid transparent;}
  .cal-event-seg:active{cursor:grabbing;}
  .cal-event-seg.selected{background:var(--accent-weak2);box-shadow:0 0 0 2px var(--accent);z-index:3;}
  .cal-event-seg.dragging{opacity:.85;z-index:50;}
  /* #422 左右控件：实心强调色小条 + 白色竖纹握把，嵌于悬浮段两端（不再复用 .cal-event-resize 基类，避免与日视图纵向条冲突） */
  .cal-event-seg .cal-event-resize-l,.cal-event-seg .cal-event-resize-r{position:absolute;top:0;bottom:0;width:12px;display:flex;align-items:center;justify-content:center;background:var(--accent);cursor:ew-resize;user-select:none;z-index:6;opacity:.92;transition:opacity .12s,background .12s;}
  .cal-event-seg .cal-event-resize-l{left:0;border-radius:3px 0 0 3px;}
  .cal-event-seg .cal-event-resize-r{right:0;border-radius:0 3px 3px 0;}
  .cal-event-seg .cal-event-resize-l:hover,.cal-event-seg .cal-event-resize-r:hover{opacity:1;background:#285FE0;}
  .cal-event-seg .cal-event-resize-l::before,.cal-event-seg .cal-event-resize-r::before{content:'';width:2px;height:52%;background:rgba(255,255,255,.92);border-radius:1px;box-shadow:3px 0 0 rgba(255,255,255,.92);}
  /* #423 月视图极端密度兜底：「+N更多」徽标（隐藏的高泳道事件整体不渲染，仅在此提示数量） */
  .cal-month-more{position:absolute;height:15px;line-height:15px;background:var(--bg-2);color:var(--text-2);font-size:10px;padding:0 5px;border-radius:8px;border:1px solid var(--border);z-index:4;box-sizing:border-box;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;text-align:center;max-width:52px;min-width:0;}
  .cal-month-more:hover{background:var(--accent-weak);color:var(--accent);border-color:var(--accent);}
  /* #424-2 「+N更多」弹层：列出该周被隐藏的任务，单击定位 */
  /* #428-2 旧 +N 弹列表样式(.cal-month-more-pop/.mm-title/.mm-item)已随弹层删除 */
  .cal-event.dragging{cursor:grabbing;opacity:.85;}
  .cal-current-line{position:absolute;height:2px;background:#F53F3F;z-index:5;pointer-events:none;box-sizing:border-box;}
  .cal-current-line::before{content:none;}
  .cal-day-col.today .cal-current-line::before{content:'';position:absolute;left:50%;top:-3px;width:8px;height:8px;border-radius:50%;background:#F53F3F;transform:translateX(-50%);}
  .cal-day-col-body .cal-current-line{left:0;right:0;}
  .cal-timeline>.cal-current-line{left:46px;right:0;}
  /* 甘特 */
  .gantt-wrap{height:100%;display:flex;flex-direction:column;overflow:hidden;position:relative;background:var(--bg);}
  .gantt-ctrl-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--border);flex:0 0 auto;}
  .gantt-left-head{flex:0 0 auto;font-weight:600;font-size:12px;color:var(--text-2);background:var(--bg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gantt-corner{box-shadow:1px 0 0 var(--border);}
  .gantt-controls{display:flex;align-items:center;gap:6px;flex:1;justify-content:flex-end;}
  /* 主体：左冻结列（不随横向滚动）+ 右独立横向滚动区，水平滚动条仅限右侧轨道区（#4） */
  .gantt-body{display:flex;flex:1;min-height:0;overflow:hidden;background:var(--bg);}
  .gantt-frozen{flex:0 0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);border-right:1px solid var(--border);}
  .gantt-fz-head{flex:0 0 auto;height:26px;border-bottom:1px solid var(--border);overflow:hidden;background:var(--bg);}
  .gantt-fz-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;background:var(--bg);scrollbar-width:none;}
  .gantt-fz-body::-webkit-scrollbar{display:none;}
  .gantt-fz-row{display:flex;align-items:center;height:var(--gantt-row-h,30px);border-bottom:1px solid var(--bg-3);}
  .gantt-fz-row.selected{background:var(--accent-weak2);}
  .gantt-fz-row.selected .gantt-cell{color:var(--accent);font-weight:600;}
  .gantt-group-fz{display:flex;align-items:center;background:var(--bg-2);font-weight:600;font-size:12px;color:var(--text-2);border-bottom:1px solid var(--bg-3);}
  .gantt-group-fz .gantt-group-label{padding:4px 8px;}
  .gantt-scroll{flex:1;min-width:0;overflow:auto;position:relative;background:var(--bg);scrollbar-width:none;}
  .gantt-scroll::-webkit-scrollbar{width:0;height:0;display:none;}
  .gantt-axis-row{display:flex;align-items:stretch;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:30;}
  .gantt-colh{flex:0 0 auto;display:flex;align-items:center;padding:0 8px;height:26px;font-size:11px;font-weight:600;color:var(--text-2);border-right:1px solid var(--bg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gantt-axis{position:relative;flex:0 0 auto;height:26px;}
  .gantt-tick{position:absolute;top:5px;font-size:11px;color:var(--text-3);white-space:nowrap;transform:translateX(2px);}
  .gantt-chart{position:relative;}
  .gantt-grid{position:absolute;top:0;bottom:0;left:0;right:0;z-index:0;pointer-events:none;}
  .gantt-gl{position:absolute;top:0;bottom:0;border-left:1px solid var(--bg-3);}
  .gantt-group{background:var(--bg-2);border-bottom:1px solid var(--bg-3);}
  .gantt-group-label{padding:4px 8px;}
  .gantt-row{display:flex;align-items:center;height:var(--gantt-row-h,30px);border-bottom:1px solid var(--bg-3);position:relative;z-index:1;}
  .gantt-cell{flex:0 0 auto;display:flex;align-items:center;padding:0 8px;height:var(--gantt-row-h,30px);font-size:12px;color:var(--text);border-right:1px solid var(--bg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gantt-cell:hover{background:var(--bg-2);}
  .gantt-track-wrap{flex:1;position:relative;height:calc(var(--gantt-row-h,30px) - 12px);margin:6px 8px;background:var(--bg-3);border-radius:4px;overflow:hidden;}
  .gantt-bar{position:absolute;height:calc(var(--gantt-row-h,30px) - 12px);background:var(--accent);border-radius:4px;min-width:6px;cursor:grab;overflow:hidden;}
  .gantt-bar:active{cursor:grabbing;}
  .gantt-bar:hover{filter:brightness(.95);}
  .gantt-progress{position:absolute;top:0;left:0;height:calc(var(--gantt-row-h,30px) - 12px);background:rgba(255,255,255,.55);}
  /* #407 甘特条两端左右调整手柄（拖拽边缘触发 resize） */
  .gantt-resize{position:absolute;top:0;bottom:0;width:10px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.9);font-size:12px;cursor:ew-resize;user-select:none;z-index:3;}
  .gantt-resize-l{left:0;}
  .gantt-resize-r{right:0;}
  .gantt-resize:hover{background:rgba(0,0,0,.18);}
  .gantt-today-line{position:absolute;top:0;bottom:0;width:2px;background:#F53F3F;z-index:6;pointer-events:none;box-sizing:border-box;}
  .gantt-row.selected,.gantt-row:hover{background:var(--accent-weak2);}
  .gantt-row.selected .gantt-track-wrap,.gantt-row:hover .gantt-track-wrap{box-shadow:inset 0 0 0 1px var(--accent);}
  .gantt-row.selected .gantt-cell,.gantt-row:hover .gantt-cell{color:var(--accent);font-weight:600;}
  .gantt-tip{padding:8px;color:var(--text-3);font-size:12px;}
  /* #350 甘特图自定义底部横向滚动条（图表区独立平移） */
  .gantt-hscroll{position:relative;height:12px;flex:0 0 auto;}
  .gantt-hscroll-track{position:absolute;left:0;right:0;top:5px;height:2px;background:var(--bg-3);border-radius:2px;}
  .gantt-hscroll-thumb{position:absolute;top:2px;height:8px;min-width:24px;background:var(--text-3);border-radius:4px;opacity:.45;cursor:grab;}
  .gantt-hscroll-thumb:hover{opacity:.75;}
  .gantt-hscroll-thumb:active{cursor:grabbing;opacity:.9;}
  /* 仪表盘 */
  .dash-wrap{height:100%;overflow:auto;padding:14px;}
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:14px;}
  .kpi-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px 16px;}
  .kpi-card .kpi-title{color:var(--text-2);font-size:12px;}
  .kpi-card .kpi-val{font-size:26px;font-weight:700;margin-top:6px;}
  .chart-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;}
  .chart-box{background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px;}
  .chart-box h4{margin:0 0 4px;font-size:13px;}
  /* 占位 / 通用 */
  .placeholder{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-3);gap:8px;}
  .placeholder .big{font-size:36px;}
  .field-panel{position:fixed;width:220px;background:#fff;border:1px solid var(--border);
    border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.12);padding:8px;z-index:20;max-height:70%;overflow:auto;}
  .field-panel label{display:flex;align-items:center;gap:8px;height:28px;cursor:pointer;font-size:12px;}
  .field-panel label input[type=checkbox]{width:16px;height:16px;margin:0;flex:0 0 auto;}
  .field-panel label span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hidden{display:none!important;}
  /* 单元格编辑时撑满单元格 */
  table.grid td.editing{padding:0!important;}
  table.grid td.editing .cell-edit{width:100%;height:100%;border-radius:0;box-sizing:border-box;display:block;}
  table.grid td.editing textarea.cell-edit{height:60px;}
  /* 右键菜单 */
  .ctx-menu{position:fixed;background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.15);padding:4px 0;z-index:50;min-width:120px;}
  .ctx-item{padding:6px 12px;font-size:12px;cursor:pointer;white-space:nowrap;}
  .ctx-item:hover{background:var(--hover);}
  .ctx-item.disabled{color:var(--text-3);cursor:not-allowed;pointer-events:none;}
  .ctx-sep{height:1px;background:var(--border);margin:4px 0;}
  /* 字段设置抽屉 */
  #settingsPanel .form-field label{flex:0 0 auto;min-width:70px;max-width:120px;text-align:left;}
  .settings-form{padding-top:4px;}
  .settings-form .form-field{margin:0;}
  .settings-form .ctrl input[type=checkbox]{width:16px;height:16px;margin:0;}
  /* 表格分组头 */
  .group-header td{background:var(--bg-2);font-weight:600;color:var(--text-2);border-bottom:1px solid var(--border-strong);}
  .group-header .group-title-cell{padding:0 9px;}
  .group-header .gdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:middle;}
  .group-header .gname{vertical-align:middle;}
  .group-header .gcount{margin-left:8px;color:var(--text-3);font-weight:400;font-size:11px;}
  /* 看板卡片字段标签 */
  .kanban-card .kfields{display:flex;flex-direction:column;gap:2px;margin-top:6px;}
  .kanban-card .kfld{font-size:11px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;}
  .kanban-card .kfld .k{color:var(--text-3);min-width:40px;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;}
  .kanban-card .kfld .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .kanban-card .kfld.no-label .k{display:none;}
  /* 画册卡片字段列表 */
  .gallery-card .gfields{margin-top:6px;display:flex;flex-direction:column;gap:2px;}
  .gallery-card .gfld{font-size:11px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;}
  .gallery-card .gfld .k{color:var(--text-3);min-width:40px;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;}
  .gallery-card .gfld .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .gallery-card .gfld.no-label .k{display:none;}
  /* #428-5 空字段占位值浅色显示，保证卡片高度按字段数统一 */
  .kanban-card .kfld .v.v-empty,.gallery-card .gfld .v.v-empty{color:var(--text-3);opacity:.6;}
  /* #426-5 画册分组：分组容器滚动、分组头、分组内网格自适应高度 */
  .gallery-host{height:100%;overflow:auto;}
  .gallery-group{margin-top:10px;}
  .gallery-group-head{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;padding:6px 12px;margin:0 2px 6px;background:var(--bg-2);border-radius:6px;}
  .gallery-group-head .gname{color:var(--text-1);}
  .gallery-group-head .gcnt{color:var(--text-3);font-weight:400;font-size:12px;}
  .gallery-grid.grouped{height:auto;overflow:visible;padding:0 12px 12px;}
  /* 输入框自动高度 */
  textarea.auto-height{overflow:hidden;resize:none;min-height:28px;}
  /* 甘特条内标签 */
  .gantt-bar-label{position:absolute;left:4px;top:0;line-height:calc(var(--gantt-row-h,30px) - 12px);font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);white-space:nowrap;pointer-events:none;padding-right:4px;}
  /* 浮层编辑器 / 模态 */
  .editor-pop{position:fixed;z-index:60;background:#fff;border:1px solid var(--accent);border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:5px;}
  .editor-pop input,.editor-pop select{height:26px;border:1px solid var(--accent);border-radius:4px;padding:0 6px;font:inherit;min-width:160px;}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:center;justify-content:center;}
  .modal{background:#fff;border-radius:10px;box-shadow:0 12px 48px rgba(0,0,0,.25);width:520px;max-width:92vw;max-height:86vh;overflow:auto;display:flex;flex-direction:column;}
  .modal-head{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:600;display:flex;align-items:center;justify-content:space-between;}
  .modal-body{padding:16px;overflow:auto;}
  .modal-foot{padding:10px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
  .form-field{display:flex;gap:10px;align-items:center;padding:6px 0;}
  .form-field label{flex:0 0 auto;min-width:70px;max-width:140px;color:var(--text-2);font-size:12px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px;}
  .form-field .ctrl{flex:1;min-width:0;}
  .form-field .ctrl input,.form-field .ctrl select,.form-field .ctrl textarea{width:100%;min-height:28px;border:1px solid var(--border);border-radius:5px;padding:4px 8px;font:inherit;background:#fff;}
  .form-field .ctrl input:focus,.form-field .ctrl select:focus,.form-field .ctrl textarea:focus{outline:none;border-color:var(--accent);background:var(--accent-weak2);box-shadow:0 0 0 3px var(--accent-weak);}
  .form-field .ctrl input[type=checkbox],.form-field .ctrl input[type=radio]{width:auto;min-height:auto;}
  .setting-row{display:flex;align-items:center;gap:10px;margin:8px 0;}
  .setting-row label{flex:0 0 132px;width:132px;min-width:132px;max-width:132px;color:var(--text-2);font-size:12px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px;}

  .setting-row select:focus,.setting-row input:focus{outline:none;border-color:var(--accent);background:var(--accent-weak2);box-shadow:0 0 0 3px var(--accent-weak);}
  /* 复选框不被 .setting-row input{flex:1} 拉伸，左对齐控件（#5） */
  .setting-row input[type=checkbox]{flex:0 0 auto;width:16px;height:16px;margin:0;}
  .modal.wide{width:720px;}
  .fs-layout{display:flex;gap:12px;min-height:320px;}
  .fs-list{width:160px;border-right:1px solid var(--border);padding-right:8px;overflow:auto;}
  .fs-list .item{padding:7px 8px;border-radius:var(--radius);cursor:pointer;font-size:12px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fs-list .item:hover{background:var(--hover);}
  .fs-list .item.active{background:var(--accent-weak);color:var(--accent);font-weight:600;}
  .fs-form{flex:1;}
  .fs-form .form-field{align-items:flex-start;}
  .fs-form .form-field label{width:90px;}
  .fs-form .form-field .ctrl input,.fs-form .form-field .ctrl select,.fs-form .form-field .ctrl textarea{width:100%;border:1px solid var(--border);border-radius:5px;padding:5px 8px;font:inherit;}
  .fs-form .form-field .ctrl input,.fs-form .form-field .ctrl select{height:30px;}
  .fs-form .form-field .ctrl textarea{height:60px;resize:vertical;}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(29,33,41,.92);color:#fff;
    padding:7px 14px;border-radius:6px;font-size:12px;z-index:80;pointer-events:none;}
  .loading{height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-3);}
  /* 甘特图右侧图表区遮罩（今日线仅覆盖右侧） */
  .gantt-overlay{position:absolute;top:0;bottom:0;z-index:6;pointer-events:none;}
  .gantt-overlay .gantt-today-line{position:absolute;top:0;bottom:0;width:2px;background:#F53F3F;box-sizing:border-box;}
  /* 甘特列标题菜单 */
  .gantt-colh{cursor:pointer;}
  .gantt-colh:hover{background:var(--hover);}
  /* 设置面板已统一为 .modal 圆角弹窗（#340），不再使用独立侧栏样式 */
  /* #343 视图顶部红色错误提示条（起止日期有误的数据行） */
  .view-err-bar{flex:0 0 auto;background:#FFECE8;border:1px solid #FBACA3;color:#CB272D;border-radius:6px;
    padding:6px 10px;margin:0 0 6px;font-size:12px;line-height:1.5;white-space:normal;word-break:break-all;}
  /* 仪表盘主题 */
  .dash-theme-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .dash-theme-row select{height:26px;border:1px solid var(--border);border-radius:var(--radius);padding:0 6px;font-size:12px;}
</style>
</head>

<div id="app">

<!--MT_BUILD-->
<script>
(function(){
  "use strict";
  // 构建信息由 C# 在加载时注入（window.__mtBuild），无需桥接即可显示，用于核对版本。
  var BUILD = window.__mtBuild || { time:"未知", version:"未知", dll:"未知" };
  (function(){ var c=document.getElementById('content'); if(c) c.innerHTML='<div class="loading">正在加载…<br><span style="font-size:12px;color:var(--text-3)">构建 '+escapeHtml(BUILD.time)+' · '+escapeHtml(BUILD.version)+'</span></div>'; })();

  // ───────── 桥接：C# <-> JS ─────────
  var pending = {};
  var msgId = 1;
  var BRIDGE_TIMEOUT = 20000;
  var listenerAdded = false;
  function webviewReady(){ return !!(window.chrome && window.chrome.webview); }
  function onBridgeMessage(e){
    var raw = e.data, data;
    if(raw && typeof raw === 'object'){ data = raw; }
    else { try{ data = JSON.parse(raw); }catch(err){ return; } }
    if(data && data.id && pending[data.id]){
      var p = pending[data.id]; delete pending[data.id];
      if(p.timer) clearTimeout(p.timer);
      if(data.ok) p.resolve(data.data); else p.reject(new Error(data.error||'bridge error'));
    } else if(data && data.type==='toast' && data.message){
      // #363 C# 侧推送的轻量通知（导出结果等）
      toast(data.message);
    }
  }
  function ensureListener(){
    if(webviewReady() && !listenerAdded){
      window.chrome.webview.addEventListener('message', onBridgeMessage);
      listenerAdded = true; return true;
    }
    return listenerAdded;
  }
  window.api = {
    call: function(method, params){
      return new Promise(function(resolve, reject){
        if(!webviewReady()){ reject(new Error('WebView2 桥接未就绪')); return; }
        ensureListener();
        var id = 'm' + (msgId++);

  function showFatal(msg){ $('content').innerHTML='<div class="placeholder"><div class="big">⚠️</div><div style="max-width:560px;text-align:center">'+escapeHtml(msg)+'</div><button class="btn primary" id="retryBtn" style="margin-top:12px">重试</button></div>'; var b=$('retryBtn'); if(b) b.addEventListener('click', function(){ $('content').innerHTML='<div class="loading">正在加载…</div>'; start(); }); }
  function start(){
    loadAppSettings();
    api.call('getAppInfo').then(function(info){ state.appInfo=info; }).catch(function(){});
    api.call('listTables').then(function(res){
      var tables = (res && res.tables) ? res.tables : (Array.isArray(res)?res:[]);
      var lastTable = (res && res.lastTable) || '';
      state.tables = tables||[];
      renderSidebar();
      // #428-3 优先恢复到上次使用的超级表
      var last = lastTable ? state.tables.find(function(t){return t.table===lastTable;}) : null;
      if(last){ openTable(last.sheet, last.table); }
      else if(state.tables.length){ openTable(state.tables[0].sheet, state.tables[0].table); }
      else { $('content').innerHTML='<div class="placeholder"><div class="big">📭</div><div>当前工作簿没有超级表（ListObject）</div><div>请在 Excel/WPS 中把数据区域转为「表格 / 超级表」</div></div>'; }
    }).catch(function(err){ showFatal('加载失败：'+err.message); });

  function reloadTables(){
    api.call('listTables').then(function(res){
      var tables = (res && res.tables) ? res.tables : (Array.isArray(res)?res:[]);
      state.tables = tables||[];
      renderSidebar();
      if(state.sheet && state.table){ openTable(state.sheet, state.table); }
      else if(state.tables.length){ openTable(state.tables[0].sheet, state.tables[0].table); }
      else { $('content').innerHTML='<div class="placeholder"><div class="big">📭</div><div>当前工作簿没有超级表（ListObject）</div></div>'; }
      toast('已刷新数据源');
    }).catch(function(err){ toast('刷新失败：'+err.message); });
  }

  function renderSidebar(){
    renderSidebarTop();
    var container=$('sidebarViews'); container.innerHTML='';
    var title=document.createElement('div'); title.className='group-title'; title.textContent='视图'; container.appendChild(title);
    // 首个用户视图前插入分隔线（自带视图 → 用户视图）
    var firstUserViewId=null;
    for(var fi=0; fi<state.views.length; fi++){
      var fv=state.views[fi];
      if(fv.viewType==='Chart') continue;
      if(isUserView(fv)){ firstUserViewId=fv.viewId; break; }
    }
    var sepInserted=false;
    state.views.forEach(function(v){
      if(v.viewType==='Chart') return;
      if(!sepInserted && firstUserViewId && v.viewId===firstUserViewId){
        var sep=document.createElement('div'); sep.className='view-sep'; container.appendChild(sep);
        sepInserted=true;
      }
      var it=document.createElement('div'); it.className='view-item'+(isUserView(v)?' user':'')+(v.viewId===state.activeViewId?' active':'');
      it.title=v.viewName||VIEW_LABEL[v.viewType]||v.viewType; // 悬停显示完整名称（左侧宽度有限会截断）
      var nameCls='vname'+(isUserView(v)?' user':'');
      it.innerHTML='<span class="ic">'+icon(VIEW_ICON[v.viewType]||'table')+'</span><span class="'+nameCls+'">'+escapeHtml(v.viewName||VIEW_LABEL[v.viewType]||v.viewType)+'</span>';
      // 右键菜单：另存新视图 / 重命名 / 删除
      it.addEventListener('contextmenu', function(e){
        e.preventDefault(); e.stopPropagation();
        showViewContextMenu(e, v);
      });
      it.addEventListener('click', function(){
        guardUnsavedVisualEdits(function(){ switchToView(v); });
      });
      container.appendChild(it);
    });
  }

  function renderSidebarTop(){

  // ───────── 全局设置 ─────────
  // 全局设置（与文件无关，保存在 localStorage['mt_app_settings']，打开任意多维表长期生效 #337）
  function defaultAppSettings(){ return { topMost:false, openMaximized:true, dashTheme:'office', labelHideThreshold:0, monthMaxEvents:5, weekStartDay:'mon', calDefaultDurationMinutes:30, showChartCardTools:true, ganttSaveMode:'auto', configSaveLocation:'both' }; }
  var APP_SETTINGS = defaultAppSettings();
  function loadAppSettings(){
    APP_SETTINGS = defaultAppSettings();
    try { if(window.localStorage){ var s=localStorage.getItem('mt_app_settings'); if(s){ var o=JSON.parse(s); if(o.topMost!=null) APP_SETTINGS.topMost=!!o.topMost; if(o.openMaximized!=null) APP_SETTINGS.openMaximized=!!o.openMaximized; if(o.dashTheme) APP_SETTINGS.dashTheme=o.dashTheme; if(o.labelHideThreshold!=null) APP_SETTINGS.labelHideThreshold=Number(o.labelHideThreshold)||0; if(o.monthMaxEvents!=null) APP_SETTINGS.monthMaxEvents=Math.max(1, parseInt(o.monthMaxEvents)||5); if(o.weekStartDay && WEEK_START_DAYS.indexOf(o.weekStartDay)>=0) APP_SETTINGS.weekStartDay=o.weekStartDay; if(o.calDefaultDurationMinutes!=null) APP_SETTINGS.calDefaultDurationMinutes=Math.max(1, parseInt(o.calDefaultDurationMinutes)||30); if(o.showChartCardTools!=null) APP_SETTINGS.showChartCardTools=!!o.showChartCardTools; if(o.ganttSaveMode && (o.ganttSaveMode==='auto'||o.ganttSaveMode==='manual')) APP_SETTINGS.ganttSaveMode=o.ganttSaveMode; if(o.configSaveLocation && (o.configSaveLocation==='excel'||o.configSaveLocation==='file'||o.configSaveLocation==='both')) APP_SETTINGS.configSaveLocation=o.configSaveLocation; } } }catch(_){}
    applyAppSettings();
    // “打开时最大化”仅在加载时应用一次（且由 C# 在窗口 Load 时再按设置设置），
    // 不能放在 applyAppSettings 里——否则切换主题色等任意保存都会把已最大化的窗口还原。
    api.call('setOpenMaximized',{value:APP_SETTINGS.openMaximized}).catch(function(){});

  function applyAppSettings(){

  // 周起始日（#342/#362）：可为一周中任意一天（sun/mon/tue/wed/thu/fri/sat）
  var WEEK_START_DAYS=['sun','mon','tue','wed','thu','fri','sat'];
  // 返回周起始日对应的 getDay() 值（0=周日 … 6=周六）
  function weekStartIndex(){ var i=WEEK_START_DAYS.indexOf(APP_SETTINGS.weekStartDay); return i<0?1:i; }
  // 把 JS 的 getDay()(0=周日) 映射为“当前周起始日”下的列序号 0..6
  function weekColOf(dateOrDow){
    var dow=(typeof dateOrDow==='number')?dateOrDow:dateOrDow.getDay();
    var s=weekStartIndex();
    return (dow - s + 7) % 7;
  }
  // 按当前周起始日返回 7 个中文星期名（周一..周日 或 周日..周六）#336
  function weekDayNames(){
    var base=['周日','周一','周二','周三','周四','周五','周六'];
    var out=[]; for(var i=0;i<7;i++){ out.push(base[(i+weekStartIndex())%7]); }
    return out;
  }
  // 日历默认时长（分钟）#335
  var CAL_DURATION_OPTIONS=[15,30,45,60,120];
  function calDefaultDuration(){ return Math.max(1, parseInt(APP_SETTINGS.calDefaultDurationMinutes)||30); }
  // 全局设置弹窗（#340：改为与甘特/日历一致的圆角方格弹窗，统一全局风格）
  function toggleSettingsPanel(anchor){
    var existing=document.getElementById('appSettingsOverlay');
    if(existing){ existing.remove(); return; }
    var ov=document.createElement('div'); ov.className='overlay'; ov.id='appSettingsOverlay';
    var modal=document.createElement('div'); modal.className='modal';
    modal.innerHTML='<div class="modal-head"><span>软件设置</span><button class="btn sm" id="xAppSet">✕</button></div>';
    var body=document.createElement('div'); body.className='modal-body';
    function settingRow(labelText){
      var row=document.createElement('div'); row.className='setting-row';
      var lab=document.createElement('label'); lab.textContent=labelText; row.appendChild(lab);
      body.appendChild(row); return row;
    }
    // 窗口置顶
    var rTop=settingRow('窗口置顶');
    var cb1=document.createElement('input'); cb1.type='checkbox'; cb1.id='setTopMost'; cb1.checked=APP_SETTINGS.topMost; rTop.appendChild(cb1);
    cb1.addEventListener('change', function(){ APP_SETTINGS.topMost=this.checked; saveAppSettings(); });
    // 打开时最大化
    var rMax=settingRow('打开时最大化');
    var cb2=document.createElement('input'); cb2.type='checkbox'; cb2.id='setOpenMax'; cb2.checked=APP_SETTINGS.openMaximized; rMax.appendChild(cb2);
    cb2.addEventListener('change', function(){ APP_SETTINGS.openMaximized=this.checked; saveAppSettings(); });
    // #359 图表控制开关（图表视图 / 仪表盘）右上角“设置/删除”按钮显隐（含图表顶部指标区设置按钮）
    var rTools=settingRow('图表控制开关');
    var cbTools=document.createElement('input'); cbTools.type='checkbox'; cbTools.id='setChartTools'; cbTools.checked=APP_SETTINGS.showChartCardTools!==false; rTools.appendChild(cbTools);
    cbTools.addEventListener('change', function(){ APP_SETTINGS.showChartCardTools=this.checked; saveAppSettings(); renderContent(); });
    // #370 月视图最大任务数（软件全局设置）：迁入软件设置窗口，与窗口置顶/最大化/图表控制开关并列
    var rMonth=settingRow('月视图最大任务数');
    var cbMonth=document.createElement('input'); cbMonth.type='number'; cbMonth.id='setMonthMaxApp'; cbMonth.min='1'; cbMonth.max='20'; cbMonth.value=APP_SETTINGS.monthMaxEvents||5; rMonth.appendChild(cbMonth);

    // #466 嵌入配置查看入口：_MultiTableConfig 是 xlSheetVeryHidden（深度隐藏），Excel 右键「取消隐藏」列表看不到，

    if(state.tables && state.tables.length){

      sel.addEventListener('change', function(){ var v=this.value; var t=state.tables.find(function(x){return x.sheet+'/'+x.table===v;}); if(t) guardUnsavedVisualEdits(function(){ openTable(t.sheet, t.table); }); });

    aboutBtn.addEventListener('click', function(){ showAbout(); });

  // #466 嵌入配置查看器：配置写入工作表 _MultiTableConfig 且设为 xlSheetVeryHidden（深度隐藏），
  // Excel 界面右键「取消隐藏」列表里不会出现，只能通过本对话框查看/临时取消深度隐藏。
  function showEmbeddedConfigDialog(){
    var old=document.getElementById('cfgViewOverlay'); if(old) old.remove();
    var ov=document.createElement('div'); ov.className='overlay'; ov.id='cfgViewOverlay';
    var modal=document.createElement('div'); modal.className='modal'; modal.style.width='780px'; modal.style.maxWidth='94vw';
    modal.innerHTML='<div class="modal-head"><span>嵌入配置（_MultiTableConfig）</span><button class="btn sm" id="xCfgView">✕</button></div>';
    var body=document.createElement('div'); body.className='modal-body';
    var info=document.createElement('div'); info.style.cssText='font-size:12px;color:var(--text-2);line-height:1.8;margin-bottom:8px';
    info.textContent='正在读取…';
    body.appendChild(info);
    var pre=document.createElement('pre'); pre.style.cssText='margin:0;max-height:44vh;overflow:auto;background:var(--bg-2);border:1px solid var(--border);border-radius:6px;padding:8px;font-size:11px;line-height:1.55;white-space:pre-wrap;word-break:break-all;';
    body.appendChild(pre);
    var tip=document.createElement('div'); tip.style.cssText='margin-top:8px;font-size:11px;color:var(--text-3);line-height:1.8';
    tip.innerHTML='说明：配置存放在名为 <b>_MultiTableConfig</b> 的工作表 A 列（每格 30000 字符分块），该表被设为 <b>xlSheetVeryHidden</b>（深度隐藏），所以 Excel 里右键「取消隐藏」看不到它。点「在 Excel 中显示」可临时改为普通可见，在 Excel 中直接查看，看完点「重新隐藏」还原。<br>注意：写隐藏表只改内存中的工作簿，必须<b>保存工作簿</b>（Ctrl+S 或下方按钮）才会真正落盘到 .xlsx。';
    body.appendChild(tip);
    modal.appendChild(body);
    var foot=document.createElement('div'); foot.className='modal-foot';
    var bShow=document.createElement('button'); bShow.className='btn'; bShow.textContent='在 Excel 中显示';
    var bHide=document.createElement('button'); bHide.className='btn'; bHide.textContent='重新隐藏';
    var bCopy=document.createElement('button'); bCopy.className='btn'; bCopy.textContent='复制 JSON';
    var bSaveWb=document.createElement('button'); bSaveWb.className='btn'; bSaveWb.textContent='保存工作簿';
    [bShow,bHide,bCopy,bSaveWb].forEach(function(b){ foot.appendChild(b); });
    var bClose=document.createElement('button'); bClose.className='btn'; bClose.textContent='关闭'; bClose.style.marginLeft='auto';
    foot.appendChild(bClose);
    modal.appendChild(foot);
    ov.appendChild(modal);
    ov.addEventListener('click', function(e){ if(e.target===ov) close(); });
    document.getElementById('overlayHost').appendChild(ov);
    function close(){ document.removeEventListener('keydown', onKey, true); ov.remove(); }
    function onKey(e){ if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); close(); } }
    document.addEventListener('keydown', onKey, true);
    modal.querySelector('#xCfgView').addEventListener('click', close);
    bClose.addEventListener('click', close);
    function refresh(){
      api.call('getEmbeddedConfig',{}).then(function(d){
        if(!d || !d.exists){
          var locName=({excel:'嵌入 Excel 工作表',file:'外部 JSON 文件',both:'两者都保存'})[APP_SETTINGS.configSaveLocation||'both'];
          info.innerHTML='<b style="color:#F76965">当前工作簿中没有 _MultiTableConfig 工作表</b>　配置保存位置：<b>'+locName+'</b>　'+(d&&d.filePath?'外部配置文件：'+escapeHtml(d.filePath):'')+'<br>若刚把保存位置切到「嵌入 Excel」，需再触发一次配置保存（例如改一次视图设置/字段显隐）才会创建该表。';
          pre.textContent='';
          return;
        }
        info.innerHTML='工作表：<b>_MultiTableConfig</b>　当前状态：<b>'+(d.visible?'普通可见':'深度隐藏 (VeryHidden)')+'</b>　JSON 字符数：<b>'+(d.length||0)+'</b>　包含超级表：<b>'+(d.tableCount||0)+'</b> 个　最后使用：<b>'+escapeHtml(d.lastTable||'-')+'</b>';
        var txt=d.json||'';
        try{ pre.textContent=JSON.stringify(JSON.parse(txt), null, 2); }
        catch(_){ pre.textContent=txt; }
      }).catch(function(err){ info.textContent='读取失败：'+err.message; });
    }
    bShow.addEventListener('click', function(){
      api.call('setConfigSheetVisible',{visible:true}).then(function(d){
        if(d&&d.ok){ toast('已在 Excel 中显示 _MultiTableConfig 工作表'); refresh(); }
        else toast('操作失败：未找到配置工作表');
      }).catch(function(err){ toast('操作失败：'+err.message); });
    });
    bHide.addEventListener('click', function(){
      api.call('setConfigSheetVisible',{visible:false}).then(function(d){
        if(d&&d.ok){ toast('已恢复深度隐藏'); refresh(); }
        else toast('操作失败：未找到配置工作表');
      }).catch(function(err){ toast('操作失败：'+err.message); });
    });
    bCopy.addEventListener('click', function(){
      var txt=pre.textContent||''; if(!txt){ toast('没有可复制的内容'); return; }
      var ta=document.createElement('textarea'); ta.value=txt; ta.style.cssText='position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); toast('配置 JSON 已复制到剪贴板'); }
      catch(_){ toast('复制失败，请手动选择文本复制'); }
      document.body.removeChild(ta);
    });
    bSaveWb.addEventListener('click', function(){
      api.call('saveWorkbookFile',{}).then(function(d){
        toast(d&&d.saved?'工作簿已保存，嵌入配置已落盘':'保存失败（工作簿可能为只读或未指定路径）');
      }).catch(function(err){ toast('保存失败：'+err.message); });
    });
    refresh();
  }

  function openTable(sheet, table, afterRender){
    api.call('openTable',{sheet:sheet, table:table}).then(function(d){
      state.sheet=d.sheet; state.table=d.table; state.fields=applyFieldOverrides(d.fields||[], d.fieldOverrides||[]); state.rows=d.rows;
      state.config=d.config; state.views=d.config.views||[];
      state.selectedRow=-1;
      _galleryImgMap=null; _galleryImgFolder='';
      state.colWidths={};
      state.fields.forEach(function(f){ state.colWidths[f.name]=defaultWidth(f.type); });
      ensureViewDefaults();
      var prevId = state.activeViewId;
      var tv = state.views.find(function(v){return v.viewId===prevId && v.viewType!=='Chart';}) || state.views.find(function(v){return v.viewType==='Table';}) || state.views.find(function(v){return v.viewType!=='Chart';}) || null;
      state.activeViewId = tv? tv.viewId : null;
      // #366 恢复该视图保存的筛选/排序/可见字段等文件级状态
      restoreViewState(tv);
      // 若该视图尚无可见字段，回退到数据源默认可见字段
      if(!state.visibleFields || !state.visibleFields.length) state.visibleFields=(d.visibleFields||[]).slice();
      var ts=$('tableSelect'); if(ts && ts.value !== sheet+'/'+table) ts.value = sheet+'/'+table;
      renderSidebar(); renderViewbar(); renderContent();
      if(typeof afterRender==='function') afterRender();
    }).catch(function(err){ toast('打开失败：'+err.message); });
  }

  function defaultWidth(type){
    switch(type){
      case 'Number': case 'Integer': case 'Currency': case 'Percentage': return 110;
      case 'Checkbox': return 70;
      case 'Date': case 'DateTime': return 140;
      case 'Select': case 'Quarter': case 'Phone': return 130;
      case 'Image': return 150;
      default: return 170;
    }
  }
  function applyFieldOverrides(fields, overrides){
    var map={}; (overrides||[]).forEach(function(o){ map[o.name]=o; });
    return fields.map(function(f){ var o=map[f.name]; if(!o) return f; var r={}; for(var k in f) r[k]=f[k]; r.type=o.type||f.type; r.options=(o.options&&o.options.length)?o.options.slice():f.options; r.format=o.format||''; r.required=!!o.required; r.minValue=o.minValue; r.maxValue=o.maxValue; r.minLength=o.minLength; r.maxLength=o.maxLength; r.regex=o.regexPattern||''; r.errorMessage=o.errorMessage||''; if(o.step!=null) r.step=o.step; return r; }); // #354 持久化步进值
  }
    function getFieldOverride(name){
    var f=state.fields.find(function(x){return x.name===name;}); return f?{name:f.name, type:f.type, options:(f.options||[]).slice(), format:f.format||'', required:!!f.required, minValue:f.minValue, maxValue:f.maxValue, minLength:f.minLength, maxLength:f.maxLength, regexPattern:f.regex||'', errorMessage:f.errorMessage||'', step:f.step}:null; // #354 回写步进值
  }

  // 为每个视图补全默认专属配置（仅当缺省时）
  function ensureViewDefaults(){
    var changed=false;
    state.views.forEach(function(v){
      if(v.viewType==='Table'){
        if(v.summaryPosition===undefined){ v.summaryPosition='DataEnd'; changed=true; }
      } else if(v.viewType==='Kanban'){
        if(!v.groupBy){ var g=firstField(['Select','Quarter','Text']); v.groupBy=g?g.name:''; changed=true; }
        if(!v.cardMeta){ var tf=firstField(['Text']); v.cardMeta={title:tf?tf.name:'',image:'',description:[]}; changed=true; }
        else if(!v.cardMeta.title){ var tf2=firstField(['Text']); if(tf2) v.cardMeta.title=tf2.name; changed=true; }
        if(v.showFieldLabels===undefined){ v.showFieldLabels=true; changed=true; }
      } else if(v.viewType==='Gallery'){
        if(!v.cardMeta){ var im=firstField(['Image']); var tf3=firstField(['Text']); v.cardMeta={title:tf3?tf3.name:'',image:im?im.name:'',description:[]}; changed=true; }
        if(v.showFieldLabels===undefined){ v.showFieldLabels=true; changed=true; }
      } else if(v.viewType==='Calendar'){
        if(!v.calendarConfig){ var df=state.fields.filter(function(f){return f.type==='DateTime'})[0]||state.fields.filter(isDate)[0]; var df2=state.fields.filter(function(f){return f.type==='DateTime'})[1]||state.fields.filter(isDate)[1]; var tf4=firstField(['Text']); v.calendarConfig={dateField:df?df.name:'',endDateField:df2?df2.name:'',titleField:tf4?tf4.name:'',colorField:'',snapMinutes:15}; changed=true; }
      } else if(v.viewType==='Gantt'){
        if(!v.ganttConfig){ var ds=state.fields.filter(isDate); v.ganttConfig={startField:ds[0]?ds[0].name:'',endField:ds[1]?ds[1].name:ds[0]?ds[0].name:'',labelField:(firstField(['Text'])||{}).name||'',groupField:'',progressField:'',timeDimension:'Month',displayFields:[],colorMode:'field',colorField:'',customColor:'#3370FF',workdaysOnly:false,boundaryMode:'feishu',boundaryExpandDays:10}; changed=true; }
      } else if(v.viewType==='Dashboard'){
        if(!v.dashboardConfig){ var num2=firstField(['Number','Integer','Currency','Percentage']); var dim2=firstField(['Select','Quarter','Text']);
          v.dashboardConfig={columns:2, statCards: num2?[{id:'k1',title:num2.name+' 合计',field:num2.name,aggregation:'Sum',format:'auto',color:''}]:[], charts: dim2&&num2?[{id:'c1',title:dim2.name+' 分布',type:'Column',dimensionField:dim2.name,metricField:num2.name,aggregation:'Sum',timeField:'',timeGroup:'None',seriesField:'',topN:12,gaugeTarget:100,columnSpan:1,height:260,showLabels:true,minLabelValue:0}]:[]}; changed=true; }
      }
    });
    // 保证甘特视图始终可用：老配置/旧版本创建时若未生成甘特视图，而数据又存在日期字段，则自动补建
    var hasGantt = state.views.some(function(v){ return v.viewType==='Gantt'; });
    if(!hasGantt){
      var dsAll = state.fields.filter(isDate);
      if(dsAll.length){
        state.views.push({
          viewId: 'gantt-'+Date.now().toString(36),
          viewType: 'Gantt',
          viewName: '甘特视图',
          userView: true,
          visibleFields: state.fields.map(function(f){return f.name;}),
          ganttConfig: { startField: dsAll[0].name, endField: dsAll.length>1?dsAll[1].name:dsAll[0].name, labelField: (firstField(['Text'])||{}).name||dsAll[0].name, groupField:'', progressField:'', timeDimension:'Month', displayFields:[], colorMode:'field', colorField:'', customColor:'#3370FF', workdaysOnly:false }
        });
        changed=true;
      }
    }
    if(changed) saveConfig();
  }
  function firstField(types){ return state.fields.find(function(f){ return types.indexOf(f.type)>=0; }); }
  function isDate(f){ return f.type==='Date'||f.type==='DateTime'; }

  // ───────── 视图工具条 ─────────
  function renderViewbar(){
    var vb=$('viewbar'); vb.innerHTML='';
    var tools=document.createElement('div'); tools.className='tools';
    var type=activeViewType();

      var add2=document.createElement('button'); add2.className='btn primary sm'; add2.textContent='＋ 新增'; add2.addEventListener('click', addRow); tools.appendChild(add2);

      var sf2=document.createElement('input'); sf2.className='search'; sf2.placeholder='查找记录…'; sf2.value=state.filter;

      var lblToggle=document.createElement('button'); lblToggle.className='btn sm'; lblToggle.textContent=allShow?'隐藏标签':'显示标签';
      lblToggle.addEventListener('click', function(){ var v=activeView(); var charts=v.dashboardConfig?v.dashboardConfig.charts:[]; var newShow=!charts.every(function(c){return c.showLabels!==false;}); charts.forEach(function(c){c.showLabels=newShow;}); saveConfig(); renderContent(); });
      tools.appendChild(lblToggle);
      // 配色主题：紧凑下拉，无标签，与「＋图表 / ＋指标」同行，节省空间
      var themeSel=document.createElement('select'); themeSel.className='btn sm'; themeSel.style.cssText='height:24px;padding:0 4px'; themeSel.title='配色主题';
      DASH_THEME_LIST.forEach(function(th){ themeSel.appendChild(new Option(th.name, th.id)); });
      themeSel.value=APP_SETTINGS.dashTheme||'office';
      themeSel.addEventListener('change', function(){ APP_SETTINGS.dashTheme=this.value; saveAppSettings(); renderContent(); toast('配色已切换为 '+this.options[this.selectedIndex].text); });

      var totalSet=document.createElement('button'); totalSet.className='btn sm'; totalSet.textContent='图表设置'; totalSet.title='按表格一次性编辑所有图表'; totalSet.addEventListener('click', showDashboardTotalSettings); tools.appendChild(totalSet);
      renderSaveSettings(tools);

    vb.appendChild(tools);
  }
  function renderSaveSettings(tools){
    var save=document.createElement('button'); save.className='btn primary sm'; save.textContent='保存设置';
    save.addEventListener('click', function(){ saveConfig(); toast('视图设置已保存'); });
    tools.appendChild(save);

  // #417 甘特行高快捷切换：写入 ganttConfig.rowHeight 并即时重渲染（与「甘特图配置」弹窗内的行高下拉同步）
  function applyGanttRowHeight(val){
    var v=activeView(); if(!v) return;
    v.ganttConfig=v.ganttConfig||{};
    v.ganttConfig.rowHeight=val;
    saveConfig();
    renderContent();
  }
  // #417 行高弹出菜单：仿字段设置「开关式」交互，点按「行高」按钮弹出小窗选择紧凑/正常/宽松
  function showGanttRowHeightMenu(anchor){
    var old=document.getElementById('ganttRHMenu'); if(old) old.remove();
    var v=activeView(); var cur=(v&&v.ganttConfig&&v.ganttConfig.rowHeight)||'compact';
    var menu=document.createElement('div'); menu.id='ganttRHMenu'; menu.className='ctx-menu';
    menu.style.position='fixed';
    var rect=anchor.getBoundingClientRect();
    menu.style.left=rect.left+'px'; menu.style.top=(rect.bottom+4)+'px';
    [['compact','紧凑'],['normal','正常'],['loose','宽松']].forEach(function(p){
      var it=document.createElement('div'); it.textContent=p[1];
      it.style.cssText='padding:7px 18px;font-size:13px;cursor:pointer;white-space:nowrap;';
      if(cur===p[0]) it.style.background='var(--accent-weak)';
      it.addEventListener('mouseenter', function(){ it.style.background='var(--bg-2)'; });
      it.addEventListener('mouseleave', function(){ it.style.background=(cur===p[0])?'var(--accent-weak)':''; });
      it.addEventListener('click', function(e){ e.stopPropagation(); applyGanttRowHeight(p[0]); menu.remove(); });
      menu.appendChild(it);
    });
    document.body.appendChild(menu);
    setTimeout(function(){ document.addEventListener('mousedown', function h(ev){ if(!menu.contains(ev.target)){ menu.remove(); document.removeEventListener('mousedown', h); } }); }, 0);
  }
  function renderCommonTools(tools, type){
    var v=activeView();
    var add=document.createElement('button'); add.className='btn primary sm'; add.textContent='＋ 新增'; add.addEventListener('click', addRow); tools.appendChild(add);
    // 图表无字段列表；日历视图字段开关无意义（#334），一并去掉
    if(type!=='Chart' && type!=='Calendar'){
      var fld=document.createElement('button'); fld.className='btn sm'; fld.textContent='字段开关'; fld.addEventListener('click', function(){ toggleFieldPanel(this); }); tools.appendChild(fld);
    }
    if(type==='Kanban' || type==='Gallery'){
      var lblToggle=document.createElement('button'); lblToggle.className='btn sm'; lblToggle.textContent=v.showFieldLabels?'隐藏标签':'显示标签';
      lblToggle.addEventListener('click', function(){ v.showFieldLabels=!v.showFieldLabels; saveConfig(); renderViewbar(); renderContent(); });

  function viewGroupField(v){ if(!v) return ''; if(v.viewType==='Kanban') return v.groupBy||''; if(v.ganttConfig) return v.ganttConfig.groupField||''; return v.groupBy||''; }
  function setViewGroupField(v, val){ if(!v) return; if(v.viewType==='Kanban') v.groupBy=val; else if(v.ganttConfig) v.ganttConfig.groupField=val; else v.groupBy=val; saveConfig(); }
  function activeView(){ return state.views.find(function(x){return x.viewId===state.activeViewId;}); }
  function activeViewType(){ var v=activeView(); return v?v.viewType:null; }
  // #366 从视图配置恢复该视图的状态（分组/排序/筛选/可见字段/汇总行位置等）
  function restoreViewState(v){
    if(!v) return;

    state.filter=v.filter||'';

  // ───────── 内容渲染分发 ─────────
  var lastRenderedViewId=null;
  function renderContent(){
    var type=activeViewType();
    if(!type){ $('content').innerHTML='<div class="placeholder"><div class="big">📭</div><div>请选择一个视图</div></div>'; return; }
    hideContextMenu();
    if(type!=='Form') closeSettingsPanel();
    // 仅在切换视图时关闭右侧详情/草稿面板；同视图内交互（日历拖拽、点击等）不再自动关闭
    if(lastRenderedViewId && lastRenderedViewId!==state.activeViewId){ closeDetailPanel(); }
    var viewChanged = lastRenderedViewId && lastRenderedViewId!==state.activeViewId;
    lastRenderedViewId=state.activeViewId;
    try {
      if(type==='Table') renderTable();
      else if(type==='Form'){ closeDetailPanel(); renderForm(); if(!$('settingsPanel').classList.contains('open')) showFieldSettings(); }
      else if(type==='Kanban') renderKanban();
      else if(type==='Gallery') renderGallery();
      else if(type==='Calendar') renderCalendar();
      else if(type==='Gantt') renderGantt();
      else if(type==='Dashboard') renderDashboard();
      else if(type==='Chart') renderChart(activeView());
      else { $('content').innerHTML='<div class="placeholder"><div class="big">🚧</div><div>视图类型 '+escapeHtml(type)+' 暂未实现</div></div>'; }
    } catch(err){
      console.error('视图渲染失败', err);
      $('content').innerHTML='<div class="placeholder"><div class="big">⚠️</div><div>视图「'+escapeHtml((activeView()&&activeView().viewName)||type)+'」渲染出错：'+escapeHtml((err&&err.message)||String(err))+'</div></div>';
    }
    // 表格视图渲染后，若详情面板已打开则同步当前选中行
    if(type==='Table' && state.selectedRow>0 && $('detailPanel').classList.contains('open')){ showDetailPanel(state.selectedRow); }
    // 若右侧详情已打开，高亮左侧对应数据
    syncLeftSelectionHighlight();
    renderSearchResults();
    // #424-4 切换视图后，若已选中任务则滚动定位到该任务（避免手动查找）
    if(viewChanged && state.selectedRow>0){
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ scrollSelectedIntoView(); }); });
    }
  }
  // #424-4 在候选元素中按 data-row 匹配选中行（兼容数字 data-row 与 JSON 串 data-row，如表格视图）
  function findRowElByIndex(sel){
    var rowIndex=state.selectedRow; if(rowIndex<=0) return null;
    var root=$('content')||document;
    var els=root.querySelectorAll(sel);
    for(var i=0;i<els.length;i++){
      var d=els[i].getAttribute('data-row');
      if(d==null) continue;
      if(d===String(rowIndex)) return els[i];
      try{ var v=JSON.parse(d); if(v && v.rowIndex===rowIndex) return els[i]; }catch(_){}
    }
    return null;
  }
  // #424-4 切换视图后滚动定位选中任务（覆盖各视图的选中元素）
  function scrollSelectedIntoView(){
    var type=activeViewType();
    var rowIndex=state.selectedRow; if(rowIndex<=0) return;
    var sel='';
    if(type==='Calendar') sel='.cal-event-seg[data-row],.cal-day-event[data-row],.cal-event[data-row]';
    else if(type==='Table') sel='tr[data-row]';
    else if(type==='Kanban') sel='.kanban-card[data-row]';
    else if(type==='Gallery') sel='.gallery-card[data-row]';
    else if(type==='Gantt') sel='.gantt-row[data-row],.gantt-fz-row[data-row]';
    else return;
    var el=findRowElByIndex(sel);
    if(el){ try{ el.scrollIntoView({block:'center', inline:'nearest'}); }catch(_){} }
  }

  // #338 查找结果统一显示格式：把所有“命中搜索词”的可见字段值用“；”连接
  // 例：搜索“刘峰” → “刘峰-项目31；刘峰”（有几个字段命中就显示几个）
  function searchHitText(row, kw){
    var out=[];
    (state.visibleFields||[]).forEach(function(fn){
      var t=displayText(fn, row); if(t==null) return;
      t=String(t).trim(); if(!t) return;
      if(!kw || t.toLowerCase().indexOf(kw)>=0){ out.push(t); }
    });
    if(out.length===0){
      // 没有可见字段命中（例如仅字段筛选命中）时，退化显示首个非空可见字段值
      (state.visibleFields||[]).some(function(fn){ var t=String(displayText(fn,row)||'').trim(); if(t){ out.push(t); return true; } return false; });
    }
    return out.join('；') || ('#'+row.rowIndex);
  }
  function renderSearchResults(){
    var box=$('searchResults'); if(!box) return;
    // 仅日历 / 表单视图需要查找结果窗口（#6）
    var vt=activeViewType();
    if(vt!=='Calendar' && vt!=='Form'){ box.classList.remove('open'); box.innerHTML=''; return; }
    var f=(state.filter||'').trim().toLowerCase();
    if(f){
      var matches=getVisibleRows();

      head.innerHTML='<span>查找结果（'+matches.length+'）</span>';
      var x=document.createElement('button'); x.className='btn sm'; x.textContent='✕'; x.addEventListener('click', function(){ var sf=document.querySelector('.search'); if(sf){ sf.value=''; } state.filter=''; renderContent(); }); head.appendChild(x);
      box.appendChild(head);
      var list=document.createElement('div'); list.className='sr-list';
      var cfgSR=(activeView()&&activeView().calendarConfig)||{};
      matches.slice(0,300).forEach(function(r){
        var item=document.createElement('div'); item.className='sr-item'+(r.rowIndex===state.selectedRow?' selected':'');
        var monColor=colorForFieldValue(cfgSR.colorField, r);
        if(monColor){ item.style.borderLeft='3px solid '+monColor; }
        // #338：表单/日历统一格式 —— 列出所有命中搜索词的可见字段值，用“；”连接
        item.textContent=searchHitText(r, f);
        // 单击：根据当前视图自动定位并高亮该任务（#312 修复：日历/甘特跳转到目标日期，表格按行号定位）
        item.addEventListener('click', function(){ locateInCurrentView(r.rowIndex); });

  // 查找结果单击：根据当前视图自动定位并高亮该任务（#312 修复）
  function locateInCurrentView(rowIndex){
    var type=activeViewType();
    var r=state.rows.find(function(x){return x.rowIndex===rowIndex;}); if(!r){ return; }
    if(type==='Form'){
      var idx=getVisibleRows().findIndex(function(x){return x.rowIndex===rowIndex;}); if(idx<0) idx=0;
      state.formNewRecord=false; state.formIndex=idx; renderForm();
    } else if(type==='Calendar'){
      var cfg=(activeView().calendarConfig||{});
      var dv=toDate(r.values[cfg.dateField]);
      if(dv){ calState.year=dv.getFullYear(); calState.month=dv.getMonth(); calState.day=dv.getDate(); }
      state.selectedRow=rowIndex; renderCalendar(); selectRow(rowIndex);
      var el=$('content').querySelector('.cal-event-seg[data-row="'+rowIndex+'"],.cal-day-event[data-row="'+rowIndex+'"],.cal-event[data-row="'+rowIndex+'"]');
      if(el){ try{ el.scrollIntoView({block:'nearest', inline:'nearest'}); }catch(_){} }
      showDetailPanel(rowIndex);
    } else if(type==='Gantt'){
      var g=(activeView().ganttConfig||{});
      if(g.startField){ var sv=toDate(r.values[g.startField]); if(sv) ganttState.anchorDate=sv; }
      state.selectedRow=rowIndex; renderGantt(); selectRow(rowIndex);
      var gel=$('content').querySelector('.gantt-row[data-row="'+rowIndex+'"]');
      if(gel){ try{ gel.scrollIntoView({block:'nearest', inline:'nearest'}); }catch(_){} }
      showDetailPanel(rowIndex);
    } else if(type==='Table'){
      var target=null;
      $('content').querySelectorAll('tbody tr[data-row]').forEach(function(t){ try{ if(JSON.parse(t.dataset.row).rowIndex===rowIndex) target=t; }catch(_){} });
      state.selectedRow=rowIndex;
      if(target){ selectRow(rowIndex, target); try{ target.scrollIntoView({block:'nearest'}); }catch(_){} }
      else { selectRow(rowIndex); }
      showDetailPanel(rowIndex);
    } else {
      // 看板 / 画册 等：selectRow 高亮 + 滚动到卡片
      state.selectedRow=rowIndex; selectRow(rowIndex);
      var el=$('content').querySelector('[data-row="'+rowIndex+'"]');
      if(el){ try{ el.scrollIntoView({block:'nearest', inline:'nearest'}); }catch(_){ el.scrollIntoView(); } }
      showDetailPanel(rowIndex);
    }
    renderSearchResults();
  }

  function getVisibleRows(){
    var rows = state.rows.slice();
    var f = state.filter.trim().toLowerCase();
    if(f){ rows = rows.filter(function(r){ return state.visibleFields.some(function(fn){ return String(displayText(fn,r)).toLowerCase().indexOf(f)>=0; }); }); }
    if(state.fieldFilter && state.fieldFilter.field){
      var ff=state.fieldFilter, ffv=(''+(ff.value==null?'':ff.value)).toLowerCase();
      rows = rows.filter(function(r){ var vv=String(displayText(ff.field,r)==null?'':displayText(ff.field,r)).toLowerCase(); return ffv==='' ? true : vv.indexOf(ffv)>=0; });
    }
    if(state.sortField && state.sortOrder){
      var fn=state.sortField, ord=state.sortOrder==='asc'?1:-1;
      rows.sort(function(a,b){
        var va=rawNum(a.values[fn]), vb=rawNum(b.values[fn]);
        if(va==null && vb==null) return 0;
        if(va==null) return 1; if(vb==null) return -1;
        if(typeof va==='number' && typeof vb==='number') return (va-vb)*ord;
        var sa=String(va), sb=String(vb); return sa<sb?-1*ord:(sa>sb?1*ord:0);
      });
    }
    return rows;
  }
  function rawNum(v){ if(typeof v==='number') return v; if(v==null) return null; var n=Number(v); return isNaN(n)?v:n; }

  // ───────── 表格视图 ─────────
  function renderTable(){
    var wrap=document.createElement('div'); wrap.className='table-wrap';
    var table=document.createElement('table'); table.className='grid';
    var colgroup=document.createElement('colgroup');
    colgroup.appendChild(col('col-rownum',46));
    state.visibleFields.forEach(function(fn){ colgroup.appendChild(col('', state.colWidths[fn]||160)); });
    table.appendChild(colgroup);
    var thead=document.createElement('thead'); var htr=document.createElement('tr');
    htr.appendChild(th('序号', 'col-rownum', null, false));
    state.visibleFields.forEach(function(fn){ var f=state.fields.find(function(x){return x.name===fn;}); htr.appendChild(th(fieldLabel(f), '', f, true)); });
    thead.appendChild(htr); table.appendChild(thead);
    var tbody=document.createElement('tbody');
    var rows=getVisibleRows();
    if(rows.length===0){
      var tr=document.createElement('tr'); var td=document.createElement('td');
      td.colSpan=state.visibleFields.length+1; td.style.textAlign='center'; td.style.color='var(--text-3)';
      td.textContent = state.rows.length===0 ? '暂无数据，点击右上角「＋ 新增」添加记录' : '没有匹配筛选条件的记录';
      tr.appendChild(td); tbody.appendChild(tr);
    }
    var v=activeView();
    var groupBy=v?viewGroupField(v):'';
    var gf=groupBy?state.fields.find(function(f){return f.name===groupBy;}):null;
    if(groupBy && gf){
      var groups={};
      rows.forEach(function(r){ var k=displayText(groupBy,r)||'（空）'; (groups[k]=groups[k]||[]).push(r); });
      var keys=Object.keys(groups);
      if(gf.type==='Select'||gf.type==='Quarter'){ var opts=(gf.options||[]).slice(); opts.push('（空）'); keys=opts.filter(function(k){return groups[k];}); Object.keys(groups).forEach(function(k){ if(keys.indexOf(k)<0) keys.push(k); }); }
      keys.forEach(function(k){
        var gh=document.createElement('tr'); gh.className='group-header';
        var ghd=document.createElement('td'); ghd.className='group-title-cell'; ghd.colSpan=state.visibleFields.length+1;
        ghd.innerHTML='<span class="gdot"></span><span class="gname">'+escapeHtml(k)+'</span><span class="gcount">'+groups[k].length+'</span>';
        gh.appendChild(ghd); tbody.appendChild(gh);
        groups[k].forEach(function(r){ appendTableRow(tbody, r); });
      });
    } else {
      rows.forEach(function(r){ appendTableRow(tbody, r); });
    }
    table.appendChild(tbody);
    if(v && v.showSummary) renderSummaryRow(table, v);

    $('content').innerHTML=''; $('content').appendChild(wrap);
    autoFitColumns();

  function appendTableRow(tbody, r){
    var tr=document.createElement('tr'); tr.dataset.row=JSON.stringify({rowIndex:r.rowIndex});
    if(r.rowIndex===state.selectedRow) tr.className='selected';
    var td0=document.createElement('td'); td0.className='col-rownum'; td0.textContent=r.rowIndex; tr.appendChild(td0);
    state.visibleFields.forEach(function(fn){
      var f=state.fields.find(function(x){return x.name===fn});
      var td=document.createElement('td'); td.className=isNum(f)?'num':'';
      td.dataset.field=fn; td.dataset.rowIndex=r.rowIndex;
      td.innerHTML=cellHtml(f,r);
      td.addEventListener('click', function(e){ e.stopPropagation(); selectRow(r.rowIndex, tr); editCell(td, f, r); });
      tr.appendChild(td);
    });
    tr.addEventListener('click', function(){ selectRow(r.rowIndex, tr); });
    tr.addEventListener('contextmenu', function(e){ showRowContextMenu(e, r.rowIndex); });
    tbody.appendChild(tr);
  }
  function autoFitColumns(){
    var table=$('content').querySelector('table.grid'); if(!table) return;
    var cols=table.querySelectorAll('colgroup col');
    var headerCells=table.querySelectorAll('thead th');
    var bodyRows=table.querySelectorAll('tbody tr');
    var sample=Math.min(bodyRows.length, 200);
    var maxCol=state.visibleFields.length; // 序号列 + 数据列（无操作列）
    for(var i=0;i<=maxCol;i++){
      var w=measureText(headerCells[i]?headerCells[i].textContent:'', 12)+28;
      for(var s=0;s<sample;s++){
        var td=bodyRows[s].children[i]; if(td && td.textContent){ var tw=measureText(td.textContent, 12)+22; if(tw>w) w=tw; }
      }
      // 序号列更紧凑
      if(i===0){ w=Math.max(34, Math.min(w, 70)); }
      else {
        var fn=state.visibleFields[i-1]; var f=state.fields.find(function(x){return x.name===fn;});
        var minW=70;
        if(f){ if(f.type==='Date'||f.type==='DateTime') minW=170; else if(f.type==='Select'||f.type==='Quarter') minW=150; else if(f.type==='Currency'||f.type==='Percentage') minW=110; }
        // 日期/下拉列额外加宽，避免编辑控件撑出或换行
        if(f && (f.type==='Date'||f.type==='DateTime'||f.type==='Select'||f.type==='Quarter')) w+=34;
        w=Math.max(minW, Math.min(w, 360));
      }
      if(cols[i]) cols[i].style.width=w+'px';
      if(i>0) state.colWidths[state.visibleFields[i-1]]=w;
    }
  }
  // ───────── 表格底部汇总行 ─────────
  var SUMMARY_MODES=[
    {mode:'None', label:'无', kind:'any'},
    {mode:'Count', label:'记录总数', kind:'any'},
    {mode:'Filled', label:'已填写', kind:'any'},
    {mode:'Empty', label:'未填写', kind:'any'},
    {mode:'Distinct', label:'唯一值', kind:'any'},
    {mode:'EmptyPct', label:'未填写占比', kind:'any'},
    {mode:'FilledPct', label:'已填写占比', kind:'any'},
    {mode:'DistinctPct', label:'唯一值占比', kind:'any'},
    {mode:'Sum', label:'求和', kind:'num'},
    {mode:'Average', label:'平均值', kind:'num'},
    {mode:'NumCount', label:'数值计数', kind:'num'},
    {mode:'Max', label:'最大值', kind:'num'},
    {mode:'Min', label:'最小值', kind:'num'},
    {mode:'Median', label:'中位数', kind:'num'},
    {mode:'StdDev', label:'标准偏差', kind:'num'},
    {mode:'Var', label:'方差', kind:'num'}
  ];
  function summaryMode(v, fn){ if(v && v.summary && v.summary[fn]) return v.summary[fn]; var f=state.fields.find(function(x){return x.name===fn;}); return isNum(f)?'Sum':'Count'; }
  function setSummaryMode(v, fn, mode){ v.summary=v.summary||{}; if(mode==='None'){ delete v.summary[fn]; } else { v.summary[fn]=mode; } saveConfig(); }
  function fmtSum(n){ if(typeof n!=='number'||isNaN(n)) return n; var r=Math.round(n*100)/100; return r.toLocaleString('zh-CN'); }
  function computeSummary(rows, f, mode){
    var vals=rows.map(function(r){ return r.values[f.name]; });
    var total=rows.length;
    function isEmpty(v){ return v==null || v===''; }
    var filled=vals.filter(function(v){ return !isEmpty(v); }).length;
    var empty=total-filled;
    function pct(n){ return total? (Math.round(n/total*1000)/10)+'%' : '0%'; }
    if(mode==='None') return '—';
    if(mode==='Count') return total;
    if(mode==='Filled') return filled;
    if(mode==='Empty') return empty;
    if(mode==='Distinct'){ var s={}; vals.forEach(function(v){ if(!isEmpty(v)) s[String(v)]=1; }); return Object.keys(s).length; }
    if(mode==='EmptyPct') return pct(empty);
    if(mode==='FilledPct') return pct(filled);
    if(mode==='DistinctPct'){ var s2={}; vals.forEach(function(v){ if(!isEmpty(v)) s2[String(v)]=1; }); return pct(Object.keys(s2).length); }
    var nums=vals.map(function(v){ var n=Number(v); return isNaN(n)?null:n; }).filter(function(x){ return x!=null; });
    if(mode==='NumCount') return nums.length;

  function replaceInput(oldEl, newEl){ var p=oldEl.parentNode; if(p){ p.replaceChild(newEl, oldEl); return newEl; } return oldEl; }
  function deepEqual(a,b){ if(a===b) return true; if(a==null || b==null) return a==b; return JSON.stringify(a)===JSON.stringify(b); }
  function normCellVal(v){ if(v==null) return ''; if(typeof v==='number') return v; if(v instanceof Date) return ''+v.getTime(); return String(v); }
  // #348 表格就地编辑：按字段类型做规范化比较，避免日期/数值因格式差异（如 "2026-08-13" vs "2026-08-13T00:00:00"）误判为已修改而误报"已保存"
  function cellValueEqual(f, val, raw){
    if(f.type==='Date'||f.type==='DateTime'){
      var a=toDate(val), b=toDate(raw);
      if(!a && !b) return true;
      if(!a || !b) return false;
      if(f.type==='DateTime') return a.getTime()===b.getTime();
      return isSameDay(a,b);
    }
    if(isNum({type:f.type})){
      var na=(val===''||val==null)?null:Number(val);
      var nb=(raw===''||raw==null)?null:Number(raw);
      if(na==null && nb==null) return true;
      if(na==null || nb==null) return false;
      return na===nb;
    }
    return normCellVal(val)===normCellVal(raw);
  }
