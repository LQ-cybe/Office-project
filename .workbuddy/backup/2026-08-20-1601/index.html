  // 看板自定义拖拽（WebView2 中 HTML5 DnD 不稳定，改用鼠标事件）
  function enableKanbanDrag(card, r, groupBy){
    card.addEventListener('mousedown', function(e){
      if(e.button!==0) return;
      e.preventDefault();
      if(window.getSelection){ try{ window.getSelection().removeAllRanges(); }catch(_){} }
      document.body.classList.add('kanban-dragging');
      var startX=e.clientX, startY=e.clientY, moved=false;
      var rect=card.getBoundingClientRect();
      var ghost=null;
      state._kanbanDragCard=card; state._kanbanDragRow=r.rowIndex; state._kanbanDragGroupBy=groupBy;
      function move(em){
        var dx=em.clientX-startX, dy=em.clientY-startY;
        if(!moved && (Math.abs(dx)>3 || Math.abs(dy)>3)){
          moved=true;
          ghost=card.cloneNode(true); ghost.classList.add('dragging'); ghost.style.position='fixed'; ghost.style.left=rect.left+'px'; ghost.style.top=rect.top+'px'; ghost.style.width=rect.width+'px'; ghost.style.zIndex='100'; ghost.style.pointerEvents='none'; document.body.appendChild(ghost);
          card.classList.add('dragging');
        }
        if(moved){ ghost.style.left=(rect.left+dx)+'px'; ghost.style.top=(rect.top+dy)+'px'; }
      }
      function up(em){
        document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up);
        if(ghost){ ghost.style.display='none'; ghost.remove(); }
        card.classList.remove('dragging'); document.body.classList.remove('kanban-dragging');
        var targetCol=null;
        if(moved){
          var els=document.elementsFromPoint(em.clientX, em.clientY);
          for(var i=0;i<els.length;i++){ var c=els[i].closest('.kanban-col'); if(c){ targetCol=c; break; } }
        }
        state._kanbanDragCard=null; state._kanbanDragRow=null; state._kanbanDragGroupBy=null;
        document.querySelectorAll('.kanban-col.dropover').forEach(function(c){ c.classList.remove('dropover'); });
          if(moved && targetCol){
          var newVal=targetCol.dataset.group==='（空）'?'':targetCol.dataset.group;
          var oldVal=r.values[groupBy];
          if(String(oldVal||'')!==String(newVal||'')){
            var rr=state.rows.find(function(x){return x.rowIndex===r.rowIndex;}); if(rr){ rr.values[groupBy]=newVal; if(rr.displayTexts) delete rr.displayTexts[groupBy]; }
            state.selectedRow=r.rowIndex;
            renderContent();
            api.call('updateCell',{rowIndex:r.rowIndex, field:groupBy, value:newVal}).then(function(){ renderContent(); toast('已移动到「'+targetCol.dataset.group+'」'); }).catch(function(err){ toast('移动失败：'+err.message+'，正在刷新'); openTable(state.sheet, state.table); });
          }
        }
      }
      document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
    });
  }

  // ───────── 画册视图 ─────────
  // 卡片图片支持两种来源：① 图片字段（字段值即图片地址）；② 文件夹匹配（按指定字段值匹配文件夹内图片文件名）
  var _galleryImgMap=null, _galleryImgFolder='';
  function imgFileKey(name){ return String(name==null?'':name).replace(/\.[^.]+$/,'').trim().toLowerCase(); }
  function resolveImagePath(map, value){
    if(!value) return '';
    var k=imgFileKey(value);
    if(map[k]) return map[k];
    var keys=Object.keys(map);
    for(var i=0;i<keys.length;i++){ if(keys[i].indexOf(k+'_')===0) return map[keys[i]]; }
    return '';
  }
  function toFileUrl(p){ if(!p) return p; p=String(p).replace(/\\/g,'/'); if(/^[a-z]+:\/\//i.test(p)) return p; if(p.charAt(0)==='/') return 'file://'+p; return 'file:///'+p; }
  // 本地图片统一经 C# 转 base64 data URI：绕过 WebView2 在 null-origin 页面下对 file:// 的拦截
  var _imgDataUriCache={};
  function setImgSrc(img, rawPath, cb){
    if(!rawPath){ img.alt=''; if(cb) cb(); return; }
    var path=String(rawPath).trim();
    if(/^(data:|https?:|blob:)/i.test(path)){ img.src=path; if(cb) cb(); return; }
    // C# File.Exists 不认 file:// 协议头，先剥掉
    var apiPath=path.replace(/^file:\/\//i, '').replace(/^\//, '');
    if(_imgDataUriCache[apiPath]){ img.src=_imgDataUriCache[apiPath]; if(cb) cb(); return; }
    img.alt='图片加载中…';
    img.style.opacity='0.6';
    api.call('getImageBase64',{path:apiPath}).then(function(res){
      img.style.opacity='';
      if(res && res.dataUri && res.ok){ _imgDataUriCache[apiPath]=res.dataUri; img.src=res.dataUri; }
      else { img.alt='图片不可用'; img.src=''; }
      if(cb) cb();
    }).catch(function(err){ img.style.opacity=''; img.alt='图片加载失败'; img.src=''; if(cb) cb(); });
  }
  function ensureGalleryImageMap(folder, cb){
    if(_galleryImgFolder===folder && _galleryImgMap){ cb(); return; }
    api.call('listImageFiles',{folder:folder}).then(function(res){
      _galleryImgFolder=folder; _galleryImgMap={}; (res&&res.files||[]).forEach(function(f){ _galleryImgMap[imgFileKey(f.name)]=f.path; }); cb();
    }).catch(function(){ _galleryImgFolder=folder; _galleryImgMap={}; cb(); });
  }
  function renderGallery(){

    var groupField=groupBy?state.fields.find(function(f){return f.name===groupBy;}):null;
    if(groupBy && !groupField) groupBy='';                                // 分组字段已不存在则退化为不分组
    var imgField=cfg.cardMeta.image, titleField=cfg.cardMeta.title;

    function buildCard(r){

      if(imgShow){

      // 字段开关：显示除图片/标题外的可见字段
      var fields=[];
      // #396 字段按数据表从左到右（state.fields 原始列序）显示，再用 visibleFields 过滤可见性，排除图片/标题字段，避免乱序
      // #428-5 空字段也渲染浅色占位，卡片高度按字段数统一而非内容
      state.fields.filter(function(f){ return state.visibleFields.indexOf(f.name)>=0 && f.name!==imgField && f.name!==titleField; }).forEach(function(f){ var fn=f.name; var val=displayText(fn,r); fields.push('<div class="gfld'+(showLabels?'':' no-label')+'"><span class="k">'+escapeHtml(f.name)+'</span> <span class="v'+(val===''?' v-empty':'')+'">'+(val===''?'—':escapeHtml(val))+'</span></div>'); });
      if(fields.length){ var gf=document.createElement('div'); gf.className='gfields'; gf.innerHTML=fields.join(''); body.appendChild(gf); }
      card.appendChild(body);
      card.addEventListener('click', function(){ selectRow(r.rowIndex); }); // #498 画册单击卡片不再自动弹出右侧详情面板
      card.addEventListener('contextmenu', function(e){ showRecordContextMenu(e, r.rowIndex); });
      if(groupBy){ enableKanbanDrag(card, r, groupBy); } // #498 画册分组模式复用看板分组自由拖拽 + 实时更新

    function buildGrid(rows){ var g=document.createElement('div'); g.className='gallery-grid'; rows.forEach(function(r){ g.appendChild(buildCard(r)); }); return g; }
    if(!groupBy){

      $('content').innerHTML=''; $('content').appendChild(buildGrid(getVisibleRows()));
    } else {
      // 按分组字段聚合（复用看板分组取值/排序逻辑）：Select/Quarter 按选项顺序，其余按出现顺序
      var groups={}; getVisibleRows().forEach(function(r){ var k=displayText(groupBy,r)||'（空）'; (groups[k]=groups[k]||[]).push(r); });
      var keys=Object.keys(groups);
      if(groupField && (groupField.type==='Select'||groupField.type==='Quarter')){
        var opts=(groupField.options||[]).slice(); opts.push('（空）'); keys=opts.filter(function(k){return groups[k];}); Object.keys(groups).forEach(function(k){ if(keys.indexOf(k)<0) keys.push(k); });
      }
      var groupColors=['#3370FF','#14C9C9','#FF7D00','#F76965','#9FDB60','#CA62E8','#FFC53D','#6E4AE0'];
      // #428-1 分组改为看板式水平列布局：每组一列，列内卡片纵向排列（复用 .kanban-cols/.kanban-col 结构）
      var host=document.createElement('div'); host.className='kanban-cols';

    }
  }

  // ───────── 日历视图 ─────────
  var calState={ year:0, month:0, view:'month', day:1 };
  function renderCalendar(){
    var v=activeView(); var cfg=v.calendarConfig||{};
    if(!cfg.dateField){ $('content').innerHTML='<div class="placeholder"><div class="big">▦</div><div>请先在「日历设置」中选择日期字段</div></div>'; return; }
    var now=new Date();
    if(!calState.year){ calState={year:now.getFullYear(), month:now.getMonth(), view:'month', day:now.getDate()}; }
    var y=calState.year, m=calState.month, view=calState.view||'month';
    var wrap=document.createElement('div'); wrap.className='calendar-wrap';
    wrap.style.position='relative';
    var head=document.createElement('div'); head.className='calendar-head';
    var title='';
    if(view==='month') title=y+' 年 '+(m+1)+' 月';
    else if(view==='week'){ var ws=weekStart(y,m,calState.day); title=fmtDate(ws)+' ~ '+fmtDate(new Date(ws.getTime()+6*86400000)); }
    else if(view==='day') title=y+' 年 '+(m+1)+' 月 '+calState.day+' 日';
    head.innerHTML='<button class="btn sm" id="calPrev">◀</button><span class="cal-title">'+title+'</span><button class="btn sm" id="calNext">▶</button><span class="cal-spacer"></span><button class="btn sm" id="calToday">今天</button><span class="cal-view-btns"><button class="btn sm'+(view==='day'?' active':'')+'" id="calDay" title="日视图">日</button><button class="btn sm'+(view==='week'?' active':'')+'" id="calWeek" title="周视图">周</button><button class="btn sm'+(view==='month'?' active':'')+'" id="calMonth" title="月视图">月</button></span>';
    wrap.appendChild(head);
    // #343 日历同样容错：开始=结束合法（零时长），仅“结束早于开始”提示错误行，不影响其它日程显示
    var calBad=[];
    if(cfg.endDateField){
      getVisibleRows().forEach(function(r){
        var s=toDate(r.values[cfg.dateField]), e=toDate(r.values[cfg.endDateField]);
        if(s&&e&&e.getTime()<s.getTime()) calBad.push({row:r.rowIndex, why:'结束日期早于开始日期'});
      });
    }
    if(calBad.length){
      var calErr=document.createElement('div'); calErr.className='view-err-bar';
      calErr.textContent='⚠ 有 '+calBad.length+' 条数据的起止日期有误，请修正：'+ganttBadRowsText(calBad);
      wrap.appendChild(calErr);
    }
    // 事件按日期分组（基于过滤后的行）
    var evMap={};
    getVisibleRows().forEach(function(r){ var dv=toDate(r.values[cfg.dateField]); if(!dv) return; var key=dv.getFullYear()+'-'+(dv.getMonth()+1)+'-'+dv.getDate(); (evMap[key]=evMap[key]||[]).push(r); });
    if(view==='month') renderMonthView(wrap, y, m, evMap, cfg, now);
    else if(view==='week') renderWeekView(wrap, y, m, calState.day, cfg, now);
    else renderDayView(wrap, y, m, calState.day, cfg, now);
    $('content').innerHTML=''; $('content').appendChild(wrap);
    var step=(view==='day'?1:(view==='week'?7:1));
    var unit=(view==='day'?'d':(view==='week'?'d':'m'));
    $('calPrev').addEventListener('click', function(){ moveCal(-step, unit); renderCalendar(); });
    $('calNext').addEventListener('click', function(){ moveCal(step, unit); renderCalendar(); });
    $('calToday').addEventListener('click', function(){ var n=new Date(); calState={year:n.getFullYear(),month:n.getMonth(),view:view,day:n.getDate()}; renderCalendar(); });
    $('calDay').addEventListener('click', function(){ calState.view='day'; renderCalendar(); });
    $('calWeek').addEventListener('click', function(){ calState.view='week'; renderCalendar(); });
    $('calMonth').addEventListener('click', function(){ calState.view='month'; renderCalendar(); });
    // 右侧详情常驻：进入日历时默认显示选中记录，否则显示当日首条任务
    if(state.selectedRow>0){ var _sr=state.rows.find(function(x){return x.rowIndex===state.selectedRow;}); if(_sr) showDetailPanel(state.selectedRow); }
    else { var _evs=getVisibleRows().filter(function(r){return toDate(r.values[cfg.dateField]);}); if(_evs.length) showDetailPanel(_evs[0].rowIndex); }
  }
  function moveCal(n, unit){
    var d=new Date(calState.year, calState.month, calState.day||1);
    if(unit==='m'){ d.setMonth(d.getMonth()+n); }
    else { d.setDate(d.getDate()+n); }
    calState.year=d.getFullYear(); calState.month=d.getMonth(); calState.day=d.getDate();
  }
  // 周起始日跟随全局设置（#342：默认周一，可切换为周日）
  function weekStart(y,m,day){
    var d=new Date(y,m,day||1); var off=weekColOf(d); return new Date(d.getFullYear(), d.getMonth(), d.getDate()-off);
  }
  // #335/#7：按“开始时间 + 日历默认时长”生成新记录起止值
  function calDraftValues(cfg, baseDate, hour, min){
    var vals={};
    if(!cfg || !cfg.dateField) return vals;
    var df=state.fields.find(function(x){return x.name===cfg.dateField;});
    var start=new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate(), hour||0, min||0, 0);
    vals[cfg.dateField]=(df&&df.type==='DateTime')?fmtDateTimeLocal(start, start.getHours(), start.getMinutes()):fmtDate(start);
    if(cfg.endDateField){
      var ef=state.fields.find(function(x){return x.name===cfg.endDateField;});
      var end=new Date(start.getTime()+calDefaultDuration()*60000);
      vals[cfg.endDateField]=(ef&&ef.type==='DateTime')?fmtDateTimeLocal(end, end.getHours(), end.getMinutes()):fmtDate(end);
    }
    return vals;
  }
  function isSameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  function renderMonthView(wrap, y, m, evMap, cfg, now){
    var first=new Date(y, m, 1); var startDow=weekColOf(first);   // #342 首列跟随周起始日

    var cells=[];
    for(var i=0;i<startDow;i++) cells.push({out:true, d:prevDays-startDow+1+i, date:new Date(y,m-1,prevDays-startDow+1+i)});
    for(var d=1;d<=daysInMonth;d++) cells.push({out:false, d:d, date:new Date(y,m,d)});
    var tail=0; while(cells.length%7!==0){ tail++; cells.push({out:true, d:tail, date:new Date(y,m+1,tail)}); }

    cells.forEach(function(c){

      var cell=document.createElement('div'); cell.className='cal-cell'+(c.out?' out':'')+((wd===0||wd===6)?' weekend':'');
      cell.dataset.date=fmtDate(c.date);                      // #339 供拖拽按"落点格子"精确定位目标日期
      var isToday=!c.out && isSameDay(c.date, now);
      cell.innerHTML='<div class="dnum">'+(isToday?'<span class="today">'+c.d+'</span>':c.d)+'</div>';
      cell.addEventListener('click', function(e){
        if(state._calDragMoved){ state._calDragMoved=false; return; } // #349 抑制拖拽结束后的落点格误点击
        if(e.target.closest('.cal-event-seg')) return;                // #422 点击悬浮段由 grid 委托处理，方格空白处才新建
        // #7 开始=方格日期（月视图无具体时刻，取 00:00），结束=开始+默认时长
        var vals=calDraftValues(cfg, c.date, 0, 0);

    grid.addEventListener('mousedown', function(e){
      if(e.button!==0) return;
      var seg=e.target.closest('.cal-event-seg'); if(!seg) return;
      var rowIdx=parseInt(seg.dataset.row,10);
      var r=getVisibleRows().find(function(x){ return x.rowIndex===rowIdx; }); if(!r) return;
      var handleL=e.target.closest('.cal-event-resize-l'), handleR=e.target.closest('.cal-event-resize-r');
      var mode;
      if(handleL) mode='resize-start';
      else if(handleR) mode='resize-end';
      else {
        var effEnd=calEndField(cfg);
        if(!effEnd) mode='move';
        else { var rect=seg.getBoundingClientRect(); var RESIZE_EDGE=12; mode=(e.clientX-rect.left<=RESIZE_EDGE)?'resize-start':((rect.right-e.clientX<=RESIZE_EDGE)?'resize-end':'move'); }
      }
      e.preventDefault(); e.stopPropagation();

    });
    // #422 选中委托：点击悬浮段选中记录并展开详情
    grid.addEventListener('click', function(e){
      if(state._calDragMoved){ state._calDragMoved=false; return; }
      var seg=e.target.closest('.cal-event-seg'); if(!seg) return;

      var rowIdx=parseInt(seg.dataset.row,10);

  // 日视图：把同一列中时间重叠的事件拆成多条“泳道”，水平并排，杜绝重叠（#298）
  function layoutDayColumn(body){

  function makeCalEventDraggable(ev, body, r, cfg){
    var v=activeView(); var cc=v.calendarConfig||{};
    var snap=(cc.snapMinutes && cc.snapMinutes>0)?cc.snapMinutes:15;
    var PX_PER_MIN=40/60; // 40px/小时 => 2/3 px/分钟
    function snapMin(m){ var s=Math.round(m/snap)*snap; return Math.max(0, Math.min(1439, s)); }

      var t=ev.querySelector('.evt-time'); if(t) t.textContent=pad(d1.getHours())+':'+pad(d1.getMinutes())+' - '+pad(d2.getHours())+':'+pad(d2.getMinutes());
    }
    function dayBaseOf(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
    var _origUserSelect='';
    function lockTextSelect(){ _origUserSelect=document.body.style.userSelect||''; document.body.style.userSelect='none'; }
    function unlockTextSelect(){ document.body.style.userSelect=_origUserSelect; }
    // 顶部把手：调整开始时间（上/下拖动）
    var topH=document.createElement('div'); topH.className='cal-event-resize-top'; ev.appendChild(topH);

      e.preventDefault(); lockTextSelect();
      var startY=e.clientY;
      var origStart=toDate(r.values[cfg.dateField])||new Date();
      var origEnd=cfg.endDateField?toDate(r.values[cfg.endDateField]):new Date(origStart.getTime()+3600000);
      var duration=origEnd.getTime()-origStart.getTime();
      var dayBase=dayBaseOf(origStart);
      function mm(em){
        var dy=em.clientY-startY;
        var nsMin=snapMin((origStart.getHours()*60+origStart.getMinutes())+dy/PX_PER_MIN);
        var ns=new Date(dayBase.getTime()+nsMin*60000);
        var ne=new Date(ns.getTime()+duration);
        r.values[cfg.dateField]=fmtDateTimeLocal(ns, ns.getHours(), ns.getMinutes());
        if(cfg.endDateField) r.values[cfg.endDateField]=fmtDateTimeLocal(ne, ne.getHours(), ne.getMinutes());
        ev.style.top=timeToTop(ns)+'px'; setLabel(ns, ne);

      var origEnd=cfg.endDateField?toDate(r.values[cfg.endDateField]):new Date(origStart.getTime()+3600000);
      var dayBase=dayBaseOf(origStart);
      var startMin=origStart.getHours()*60+origStart.getMinutes(), endMin=origEnd.getHours()*60+origEnd.getMinutes();
      function mm(em){
        var dy=em.clientY-startY;

        if(nsMin>endMin-snap) nsMin=endMin-snap; // 开始不得晚于结束
        var ns=new Date(dayBase.getTime()+nsMin*60000);
        r.values[cfg.dateField]=fmtDateTimeLocal(ns, ns.getHours(), ns.getMinutes());
        ev.style.top=timeToTop(ns)+'px';
        ev.style.height=Math.max(20, endMin-nsMin)*PX_PER_MIN+'px';
        setLabel(ns, origEnd);
      }
      function mu(){ document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); unlockTextSelect(); finishDrag(); }
      document.addEventListener('mousemove', mm); document.addEventListener('mouseup', mu);
    });
    // 底部把手：仅调整结束时间（上拖变早 / 下拖变晚）
    if(botH) botH.addEventListener('mousedown', function(e){
      e.preventDefault(); e.stopPropagation(); lockTextSelect();
      var startY=e.clientY;
      var origStart=toDate(r.values[cfg.dateField])||new Date();
      var origEnd=cfg.endDateField?toDate(r.values[cfg.endDateField]):new Date(origStart.getTime()+3600000);
      var dayBase=dayBaseOf(origStart);
      var startMin=origStart.getHours()*60+origStart.getMinutes(), endMin=origEnd.getHours()*60+origEnd.getMinutes();

        var ne=new Date(dayBase.getTime()+neMin*60000);

      function mu(){ document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); unlockTextSelect(); finishDrag(); }
      document.addEventListener('mousemove', mm); document.addEventListener('mouseup', mu);
    });

    }
  }
  function updateCalEventTime(r, cfg, newStart, newEnd){
    var sv=fmtDateTimeLocal(newStart, newStart.getHours(), newStart.getMinutes());
    var updates=[{field:cfg.dateField, value:sv}];
    if(cfg.endDateField && newEnd){ updates.push({field:cfg.endDateField, value:fmtDateTimeLocal(newEnd, newEnd.getHours(), newEnd.getMinutes())}); }
    // 先本地更新再保存
    r.values[cfg.dateField]=sv;

      api.call('updateCell',{rowIndex:r.rowIndex, field:u.field, value:u.value}).then(function(){ pending--; if(pending===0) toast('时间已更新'); }).catch(function(err){ toast('保存失败：'+err.message); });
    });
  }
  function fmtDateTimeLocal(d, h, m){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(h)+':'+pad(m)+':00'; }
  function toDate(v){ if(v==null||v==='') return null; if(v instanceof Date) return v; if(typeof v==='string'){ var d=new Date(v); return isNaN(d)?null:d; } return null; }
  // #356 月视图拖拽：抽出公共逻辑，按 mode 区分 平移(move)/调开始(resize-start)/调结束(resize-end)
  // 参考 GanttWPF 的“命中左右边缘→像素转日期”思路：左侧手柄=改开始、右侧手柄=改结束、主体=整体平移。
  // #416 月视图左右拉伸：未显式配置结束日期字段时，自动取表中另一个日期字段作为结束（开始/结束成对在日历中常见，如「开始日期/截止日期」），使拉伸控件在真实数据上默认可用；显式配置优先
  function calEndField(cfg){
    if(cfg && cfg.endDateField) return cfg.endDateField;
    if(!cfg || !cfg.dateField) return null;
    var ds=state.fields.filter(function(f){ return (f.type==='Date'||f.type==='DateTime') && f.name!==cfg.dateField; });
    return ds.length?ds[0].name:null;
  }
  // #422/#423 月视图悬浮分段：日期->方格索引、区间图着色(跨band锁lane)、按周紧凑(独占周→0 往前推)、6行等高、+N弹列表
  var MT_LANEH=18, MT_LANEGAP=3, MT_PADX=3, MT_PADTOP=28, MT_CELLMIN=30, MT_DRAGGING=false;
  // #427-4 行高=6行等分(30px repeat(6,1fr))；K=每周可容纳泳道数，由 layoutMonthEvents 测首格实际行高后算
  // #426-3 MT_MAXLANES：设置「月视图任务最大数」失效根因=曾为模块级常量加载时求值；现改 layoutMonthEvents 内实时读（K 计算用）
  // #428-2 +N 点击展开该周：MT_EXPANDED[band]=true → 该周行给显式像素高容纳全部泳道、不再出 +N（切月自动重置）
  var MT_EXPANDED={}, MT_LAST_MONTH_KEY='';
  function cellIndexForDate(cells, date){
    for(var i=0;i<cells.length;i++){ var cd=cells[i].date; if(cd.getFullYear()===date.getFullYear() && cd.getMonth()===date.getMonth() && cd.getDate()===date.getDate()) return i; }
    return -1;
  }
  function layoutMonthEvents(grid, cells, cellEls, cfg){
    // #426-3 实时读取「月视图任务最大数」设置（K 兜底上限）
    var MT_MAXLANES=(APP_SETTINGS.monthMaxEvents && APP_SETTINGS.monthMaxEvents>0)?APP_SETTINGS.monthMaxEvents:8;
    // 清掉上次渲染的分段/徽标，使本函数可幂等重复调用
    var prev=grid.querySelectorAll('.cal-event-seg, .cal-month-more');
    for(var pi=0; pi<prev.length; pi++) prev[pi].remove();
    var effEnd=calEndField(cfg);
    var g0=cells[0].date, g1=cells[cells.length-1].date;
    // 1) 收集所有有效事件及其跨 band 的 [bs,be,band] 区间
    var events=[];
    getVisibleRows().forEach(function(r){
      var s=toDate(r.values[cfg.dateField]); if(!s) return;
      var e=effEnd?toDate(r.values[effEnd]):null; if(!e) e=new Date(s.getTime());
      if(e<g0 || s>g1) return;
      if(s<g0) s=new Date(g0); if(e>g1) e=new Date(g1);
      var sIdx=cellIndexForDate(cells,s), eIdx=cellIndexForDate(cells,e); if(sIdx<0||eIdx<0) return;
      var bands=[], b=sIdx;
      while(b<=eIdx){ var band=Math.floor(b/7), bs=b, be=Math.min(eIdx, band*7+6); bands.push([bs,be,band]); b=be+1; }
      events.push({r:r, sIdx:sIdx, eIdx:eIdx, bands:bands});
    });
    // 2) 区间图着色(按起始排序贪心)：每个事件分配到所有涉及 band 中第一个空闲泳道；跨 band 锁 lane(保证同事件各周段同泳道)
    var bandLanes=[ [],[],[],[],[],[] ];
    function laneFreeInBands(lane, bands){
      for(var bi=0;bi<bands.length;bi++){ var bn=bands[bi][2], bs=bands[bi][0], be=bands[bi][1], arr=bandLanes[bn];
        for(var oi=0;oi<arr.length;oi++){ var o=arr[oi]; if(o.lane===lane && o.s<=be && o.e>=bs) return false; } }
      return true;
    }
    events.sort(function(a,b){ return a.sIdx-b.sIdx || a.eIdx-b.eIdx; });
    events.forEach(function(ev){
      var lane=0; while(!laneFreeInBands(lane, ev.bands)) lane++;
      ev.lane=lane;
      ev.bands.forEach(function(bd){ bandLanes[bd[2]].push({s:bd[0],e:bd[1],lane:lane}); });
    });
    // 3) #428-2 展开/折叠：切换月份时重置展开状态；展开周按实际泳道数给显式像素高(容纳全部)，其余周仍 1fr 等分
    var mkKey=calState.year+'-'+calState.month;
    if(MT_LAST_MONTH_KEY!==mkKey){ MT_LAST_MONTH_KEY=mkKey; MT_EXPANDED={}; }
    // 4) 每 band 实际并发泳道数(= 该 band 内最大 lane+1)
    var laneCount=[0,0,0,0,0,0];
    for(var b=0;b<6;b++){ var mx=0; events.forEach(function(ev){ if(ev.bands.some(function(bd){return bd[2]===b;})){ var lv=ev.lane+1; if(lv>mx) mx=lv; } }); laneCount[b]=mx; }
    var rowSpecs=['30px'];
    for(var b=0;b<6;b++){
      rowSpecs.push(MT_EXPANDED[b] ? Math.max(34, MT_PADTOP+4+laneCount[b]*(MT_LANEH+MT_LANEGAP))+'px' : '1fr');
    }
    grid.style.gridTemplateRows=rowSpecs.join(' ');
    // 5) K=折叠周可容纳泳道数：用首个非展开周的首格实际行高算（展开周全部显示，无需 K）
    var rowH=0;
    for(var b=0;b<6;b++){ if(!MT_EXPANDED[b]){ rowH=cellEls[b*7].offsetHeight||0; break; } }
    var K = rowH>0 ? Math.max(1, Math.floor((rowH - MT_PADTOP - 4)/(MT_LANEH+MT_LANEGAP))) : MT_MAXLANES;
    // 6) 折叠：仅【非展开】周且并发泳道 > K 时，超出段隐藏并出「+N」；点击 +N 展开该周全部项目(行加高、按钮消失)
    var hiddenByBand={};      // band -> {rowIndex:true} 该 band 内被隐藏(溢出)的段
    var moreCountByBand=[0,0,0,0,0,0];
    for(var b=0;b<6;b++){
      if(!MT_EXPANDED[b] && laneCount[b]>K){
        hiddenByBand[b]={};
        events.forEach(function(ev){
          if(ev.bands.some(function(bd){return bd[2]===b;}) && ev.lane>=K){
            hiddenByBand[b][ev.r.rowIndex]=true; moreCountByBand[b]++;
          }
        });
      }
    }
    // 7) #427-1 按周紧凑：仅按【可见(未隐藏)】事件的原始 lane 连续重编号 0,1,2…
    //    跨周项目在稀疏/独占周自动落到 lane 0(往前推)，不浪费纵向空间、不被折叠；各周行数可能不同(放弃连续长条同行，换独占周不浪费)
    var laneMap=[[],[],[],[],[],[]];   // band -> { 原始lane: 紧凑lane }
    for(var b=0;b<6;b++){
      var lanesInB={};
      events.forEach(function(ev){ if(ev.bands.some(function(bd){return bd[2]===b;}) && !(hiddenByBand[b]&&hiddenByBand[b][ev.r.rowIndex])) lanesInB[ev.lane]=true; });
      var sortedL=Object.keys(lanesInB).map(Number).sort(function(a,b){return a-b;});
      sortedL.forEach(function(orig, idx){ laneMap[b][orig]=idx; });
    }
    // 8) 渲染分段（仅隐藏该 band 内的溢出段）
    events.forEach(function(ev){
      ev.bands.forEach(function(bd){
        var b=bd[2];
        if(hiddenByBand[b] && hiddenByBand[b][ev.r.rowIndex]) return;
        var cl=laneMap[b][ev.lane]; if(cl===undefined) return;
        makeMonthSeg(grid, cellEls, ev.r, cfg, bd[0], bd[1], cl, bd[0]===ev.sIdx, bd[1]===ev.eIdx);
      });
    });
    // 9) 「+N」徽标：仅【非展开】周且有隐藏时出现；#428-2 点击=展开该周行高显示全部项目并隐藏 +N（不再弹列表/无收起按钮）
    for(var b2=0;b2<6;b2++){
      var cnt=moreCountByBand[b2];
      if(cnt>0){
        var lc=cellEls[b2*7+6];
        var more=document.createElement('div'); more.className='cal-month-more';
        more.textContent='+'+cnt;
        more.title=cnt+' 项未显示，点击展开该周';

        if(dim==='day'){ var m=Math.round(x.getMinutes()/15)*15; x.setMinutes(m); x.setSeconds(0); }
        else { x.setHours(0,0,0,0); }
        return x;
      }
      function onMove(ev){
        moved=true;
        var dx=ev.clientX-startX;
        var dPct=(dx/trackRect.width)*100;
        if(mode==='move'){
          var newLeft=Math.max(0, Math.min(100-startWidth, startLeft+dPct));
          bar.style.left=newLeft+'%';
        } else if(mode==='resize-r'){
          var newWidth=Math.max(0.3, startWidth+dPct);
          bar.style.left=startLeft+'%';
          bar.style.width=newWidth+'%';
        } else { // resize-l：左端移动，右端固定
          var nl=Math.max(0, startLeft+dPct);
          var nr=Math.min(100, origRightPct);
          if(nr-nl<0.3) nl=nr-0.3;
          bar.style.left=nl+'%';
          bar.style.width=(nr-nl)+'%';
        }
      }
      function onUp(ev){
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        if(!moved) return;
        var totalMs=ganttState.max-ganttState.min;
        var newLeft=parseFloat(bar.style.left)||0;
        var newWidth=parseFloat(bar.style.width)||0;
        var newStart=new Date(ganttState.min.getTime()+(newLeft/100)*totalMs);
        var newEnd=new Date(ganttState.min.getTime()+((newLeft+newWidth)/100)*totalMs);
        newStart=alignDate(newStart); newEnd=alignDate(newEnd);
        if(newEnd<=newStart) newEnd=new Date(newStart.getTime()+86400000);
        var sf=state.fields.find(function(x){return x.name===cfg.startField;});
        var updates=[];
        updates.push({field:cfg.startField, value:(sf&&sf.type==='DateTime')?fmtDateTimeLocal(newStart,newStart.getHours(),newStart.getMinutes()):fmtDate(newStart)});
        if(cfg.endField){
          var ef=state.fields.find(function(x){return x.name===cfg.endField;});
          updates.push({field:cfg.endField, value:(ef&&ef.type==='DateTime')?fmtDateTimeLocal(newEnd,newEnd.getHours(),newEnd.getMinutes()):fmtDate(newEnd)});
        }
        if(APP_SETTINGS.ganttSaveMode==='manual'){
          // #402 手动模式：仅更新内存中的行数据并标记脏，不立即写回；由“保存调整”按钮或关闭/切换确认时写回
          r.values[cfg.startField]=updates[0].value;
          if(cfg.endField && updates[1]) r.values[cfg.endField]=updates[1].value;
          bar.title=ganttBarTooltip(cfg, r);
          markGanttDirty(r, updates, cfg);
          ganttCenterBarIfNeeded(bar); // #408 仅当移出可视范围才居中
          toast('已调整，尚未保存（手动模式）');
        } else {
          // #408 自动模式：拖完即存；不再整体重渲染（否则水平滚动条会跳回），仅刷新提示与按需居中
          var pending=updates.length;
          updates.forEach(function(u){ api.call('updateCell',{rowIndex:r.rowIndex, field:u.field, value:u.value}).then(function(){ r.values[u.field]=u.value; bar.title=ganttBarTooltip(cfg, r); pending--; if(pending===0){ toast('时间已更新'); ganttCenterBarIfNeeded(bar); } }).catch(function(err){ toast('保存失败：'+err.message); }); });
        }
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  }
  // ───────── #402 甘特手动保存模式：脏缓冲 / 保存条 / 切换-关闭拦截 ─────────
  function ganttPendingStore(){ state._ganttPending=state._ganttPending||{}; return state._ganttPending; }
  function markGanttDirty(r, updates, cfg){
    var store=ganttPendingStore();
    var rec={ startField:cfg.startField, newStart:updates[0].value };
    if(cfg.endField && updates[1]){ rec.endField=cfg.endField; rec.newEnd=updates[1].value; }
    rec.origStart=String(r.values[cfg.startField]||'');
    if(cfg.endField) rec.origEnd=String(r.values[cfg.endField]||'');
    store[r.rowIndex]=rec;
    state._ganttDirty=true;
    showGanttSaveBar();
    pushVisualEditDirty();
  }
  function showGanttSaveBar(){
    if(APP_SETTINGS.ganttSaveMode!=='manual') return;
    var store=ganttPendingStore(); var n=Object.keys(store).length;
    if(n<=0){ hideGanttSaveBar(); return; }
    var bar=document.getElementById('ganttSaveBar');
    if(!bar){ bar=document.createElement('div'); bar.id='ganttSaveBar'; bar.className='gantt-save-bar'; document.body.appendChild(bar); }
    bar.innerHTML='';
    var txt=document.createElement('span'); txt.className='gantt-save-txt'; txt.textContent='有 '+n+' 项调整未保存'; bar.appendChild(txt);
    var saveBtn=document.createElement('button'); saveBtn.className='btn primary sm'; saveBtn.textContent='保存调整'; saveBtn.addEventListener('click', function(e){ e.stopPropagation(); flushGanttEdits(); }); bar.appendChild(saveBtn);
    var discBtn=document.createElement('button'); discBtn.className='btn sm'; discBtn.textContent='放弃'; discBtn.addEventListener('click', function(e){ e.stopPropagation(); discardGanttEdits(); }); bar.appendChild(discBtn);
  }
  function hideGanttSaveBar(){ var bar=document.getElementById('ganttSaveBar'); if(bar) bar.remove(); }
  function flushGanttEdits(){
    return new Promise(function(resolve){
      var store=ganttPendingStore(); var keys=Object.keys(store); if(!keys.length){ resetGanttDirty(); resolve(); return; }
      var done=0; var total=keys.length;
      keys.forEach(function(k){
        var rec=store[k]; var rowIdx=parseInt(k,10);
        var calls=[{rowIndex:rowIdx, field:rec.startField, value:rec.newStart}];
        if(rec.endField) calls.push({rowIndex:rowIdx, field:rec.endField, value:rec.newEnd});
        var pending=calls.length;
        calls.forEach(function(c){ api.call('updateCell',c).then(function(){ var rr=state.rows.find(function(x){return x.rowIndex===c.rowIndex;}); if(rr) rr.values[c.field]=c.value; pending--; if(pending===0){ done++; if(done>=total){ resetGanttDirty(); renderGantt(); toast('已保存 '+total+' 项调整'); resolve(); } } }).catch(function(err){ pending--; done++; if(done>=total){ resetGanttDirty(); renderGantt(); toast('部分保存失败：'+err.message); resolve(); } }); });
      });
    });
  }
  function discardGanttEdits(){
    var store=ganttPendingStore(); Object.keys(store).forEach(function(k){ var rec=store[k]; var rr=state.rows.find(function(x){return x.rowIndex===parseInt(k,10);}); if(rr){ rr.values[rec.startField]=rec.origStart; if(rec.endField) rr.values[rec.endField]=rec.origEnd; } });
    resetGanttDirty(); renderGantt(); toast('已放弃未保存调整');
  }
  function resetGanttDirty(){ state._ganttPending={}; state._ganttDirty=false; hideGanttSaveBar(); pushVisualEditDirty(); }
  function pushVisualEditDirty(){ try{ api.call('setVisualEditDirty',{dirty:!!state._ganttDirty, count:Object.keys(state._ganttPending||{}).length}).catch(function(){}); }catch(_){} }
  // 切换视图 / 切换数据源前，若有未保存的手动调整，弹“保存 / 不保存 / 取消”确认（软件自身 HTML 弹窗）
  function guardUnsavedVisualEdits(proceed){
    if(!(APP_SETTINGS.ganttSaveMode==='manual' && state._ganttDirty)){ proceed(); return; }
    showConfirm3('未保存的甘特图调整', '有未保存的甘特图调整，是否保存？', [
      {label:'保存', primary:true, value:'save'},
      {label:'不保存', value:'discard'},
      {label:'取消', value:'cancel'}
    ], function(res){
      if(res==='cancel') return;
      if(res==='save') flushGanttEdits();
      else if(res==='discard') discardGanttEdits();
      proceed();
    });
  }

  // ───────── 视图管理：另存为新视图 / 删除（默认基本视图受保护）─────────
  // 默认基本视图 = 首个 Table 视图（无则首个视图），保证始终存在、不可删除
  function getDefaultViewId(){
    var tv=state.views.find(function(x){return x.viewType==='Table';});
    return (tv || state.views[0] || {}).viewId;
  }
  function isDefaultView(v){ return !!v && v.viewId===getDefaultViewId(); }
  // 是否为用户创建的视图（UserView=true）。只有此类视图可重命名 / 删除；
  // 自带基础视图 UserView=false，受保护，不可删、不可改名。
  // 兜底：早期版本（加 UserView 字段之前）用 JS 生成的 copy- / gantt- 前缀残留视图
  // 没有 userView 标记，按前缀判定为可删 / 可改名，避免右键菜单无对应选项。
  function isUserView(v){ return !!(v && (v.userView || (typeof v.viewId==='string' && /^(?:copy|gantt)-/.test(v.viewId)))); }
  // 生成不重复的视图名称（副本后缀）—— 保留以兼容图表视图另存等旧调用
  function uniqueViewName(base){
    base=base||'视图';
    var names=state.views.map(function(v){return v.viewName;});
    if(names.indexOf(base)<0) return base;
    var i=1; var cand=base+' 副本';
    while(names.indexOf(cand)>=0){ i++; cand=base+' 副本'+i; }
    return cand;
  }
  // 另存新视图的默认名称：去「视图」二字后的基名 + 序号递增（表格1/表格2、看板1/看板2…）
  function nextCopyName(viewType){
    var base=VIEW_LABEL[viewType]||viewType;
    var max=0;
    var re=new RegExp('^'+base+'(\\d+)$');
    state.views.forEach(function(v){ var m=re.exec(v.viewName||''); if(m){ var n=parseInt(m[1],10); if(n>max) max=n; } });
    return base+(max+1);
  }
  // 另存为新视图：弹框由用户输入名称（预填「类型+序号」），确认后深拷贝当前视图并切换

    v=v||activeView(); if(!v) return;
    var suggested=nextCopyName(v.viewType);
    var ov=document.createElement('div'); ov.className='overlay'; ov.id='dupViewOverlay';
    var modal=document.createElement('div'); modal.className='modal'; modal.style.maxWidth='360px';
    modal.innerHTML='<div class="modal-head"><span>另存为新视图</span></div>';

    body.innerHTML='<div class="form-field" style="margin:0;"><label style="min-width:56px;">名称</label>'
      +'<input id="dupViewInput" type="text" maxlength="40" style="flex:1;" value="'+escapeHtml(suggested)+'"></div>';
    modal.appendChild(body);
    var foot=document.createElement('div'); foot.className='modal-foot';
    var cancelBtn=document.createElement('button'); cancelBtn.className='btn'; cancelBtn.textContent='取消';
    cancelBtn.addEventListener('click', function(){ ov.remove(); });
    var okBtn=document.createElement('button'); okBtn.className='btn primary'; okBtn.textContent='确定';
    okBtn.addEventListener('click', function(){
      var inp=document.getElementById('dupViewInput');
      var name=(inp.value||'').trim();
      if(!name){ toast('名称不能为空'); inp.focus(); return; }
      if(state.views.some(function(x){ return (x.viewName||'')===name; })){ toast('已存在同名视图'); inp.focus(); return; }
      var copy=JSON.parse(JSON.stringify(v));
      copy.viewId='copy-'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36);
      copy.userView=true; // 标记为「另存」产生的用户视图，可重命名 / 删除
      copy.viewName=name;
      state.views.push(copy);
      state.activeViewId=copy.viewId;
      saveConfig();
      ov.remove();
      renderSidebar(); renderViewbar(); renderContent();
      toast('已另存为「'+name+'」');
    });
    foot.appendChild(cancelBtn); foot.appendChild(okBtn);
    modal.appendChild(foot); ov.appendChild(modal);
    document.getElementById('overlayHost').appendChild(ov);

    if(input){ input.focus(); input.select(); }

  // 删除视图；自带基础视图（UserView=false）受保护，不可删除
  function deleteView(v){
    v=v||activeView(); if(!v) return;
    if(!isUserView(v)){ toast('自带视图不可删除'); return; }
    if(!confirm('确定删除视图「'+(v.viewName||'')+'」？')) return;
    var idx=state.views.findIndex(function(x){return x.viewId===v.viewId;});
    if(idx<0) return;
    state.views.splice(idx,1);
    // 若删除的是当前活动视图，回退到默认基本视图
    if(state.activeViewId===v.viewId){
      var defId=getDefaultViewId();
      var tv=state.views.find(function(x){return x.viewId===defId;}) || state.views[0] || null;
      state.activeViewId=tv?tv.viewId:null;
      if(tv) restoreViewState(tv);
    }
    saveConfig();
    renderSidebar(); renderViewbar(); renderContent();
    toast('已删除');
  }

  function fmtDate(d){ return d? (d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())) : ''; }
  function pad(n){ return n<10?'0'+n:''+n; }

  // ───────── 仪表盘 / 图表 ─────────
  function aggregate(rows, field, mode){
    var vals=rows.map(function(r){ var v=r.values[field]; var n=Number(v); return isNaN(n)?null:n; }).filter(function(x){return x!=null;});
    if(mode==='Count') return rows.length;
    if(vals.length===0) return 0;
    if(mode==='Average') return vals.reduce(function(a,b){return a+b;},0)/vals.length;
    if(mode==='Max') return Math.max.apply(null,vals);
    if(mode==='Min') return Math.min.apply(null,vals);
    if(mode==='DistinctCount'){ var s={}; vals.forEach(function(x){s[x]=1;}); return Object.keys(s).length; }
    return vals.reduce(function(a,b){return a+b;},0); // Sum
  }
  function fmtNum(n, format){
    if(format==='money'||format==='percent') {} // 仅简单处理
    if(Math.abs(n)>=10000) return (n/10000).toFixed(1)+'万';
    return (Math.round(n*100)/100).toLocaleString('zh-CN');
  }

  function renderChart(v){

  function buildChartBox(cfg, rows){
    var box=document.createElement('div'); box.className='chart-box';
    box.innerHTML='<h4>'+escapeHtml(cfg.title||'图表')+'</h4>';
    var svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('width','100%'); svg.setAttribute('height',(cfg.height||260));
    drawChart(svg, cfg, rows);
    box.appendChild(svg);
    return box;
  }
  function drawChart(svg, cfg, rows){
    rows = rows || state.rows;
    var W=360, H=cfg.height||260, padL=40, padB=24, padT=18, padR=6;
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    // 分组聚合
    var groups=groupAggregate(rows, cfg);
    if(groups.length===0){ var t=document.createElementNS('http://www.w3.org/2000/svg','text'); t.setAttribute('x',W/2); t.setAttribute('y',H/2); t.setAttribute('text-anchor','middle'); t.textContent='无数据'; svg.appendChild(t); return; }
    var colors=getDashColors();
    var maxV=Math.max.apply(null, groups.map(function(g){return g.value;}).concat([1]));
    if(cfg.type==='Pie'||cfg.type==='Doughnut'){
      var cx=W/2, cy=H/2, r=Math.min(W,H)/2-22, total=groups.reduce(function(a,b){return a+b.value;},0)||1;
      var ang=-Math.PI/2;
      groups.forEach(function(g,i){
        var a2=ang+g.value/total*Math.PI*2;
        var mid=(ang+a2)/2;
        var path=document.createElementNS('http://www.w3.org/2000/svg','path');
        var x1=cx+r*Math.cos(ang), y1=cy+r*Math.sin(ang), x2=cx+r*Math.cos(a2), y2=cy+r*Math.sin(a2);
        var large=(a2-ang)>Math.PI?1:0;
        var d='M '+cx+' '+cy+' L '+x1+' '+y1+' A '+r+' '+r+' 0 '+large+' 1 '+x2+' '+y2+' Z';
        path.setAttribute('d',d); path.setAttribute('fill',colors[i%colors.length]); path.setAttribute('stroke','#fff');
        svg.appendChild(path);
        if(cfg.showLabels!==false && g.value > (APP_SETTINGS.labelHideThreshold || 0)){
          var lr=cfg.type==='Doughnut'?r*0.78:r*0.65;
          var lx=cx+lr*Math.cos(mid), ly=cy+lr*Math.sin(mid);
          var txt=document.createElementNS('http://www.w3.org/2000/svg','text');
          txt.setAttribute('x',lx); txt.setAttribute('y',ly+4); txt.setAttribute('text-anchor','middle'); txt.setAttribute('font-size','10'); txt.setAttribute('fill','#fff');
          txt.textContent=(total?Math.round(g.value/total*100):0)+'%';
          svg.appendChild(txt);
        }
        ang=a2;
      });
      if(cfg.type==='Doughnut'){
        var hole=document.createElementNS('http://www.w3.org/2000/svg','circle');
        hole.setAttribute('cx',cx); hole.setAttribute('cy',cy); hole.setAttribute('r',r*0.55);
        hole.setAttribute('fill','#fff');
        svg.appendChild(hole);
      }
      return;
    }
    var plotW=W-padL-padR, plotH=H-padT-padB;
    var n=groups.length;
    var drawPadL=padL, drawPlotW=plotW;
    if(cfg.type==='Bar'){ drawPadL=70; drawPlotW=W-drawPadL-padR; } // 横向条形需要更宽左侧标签区
    var bw=drawPlotW/n;
    // 轴线（#364：折线/面积图去掉底部横线，仅柱状/条形保留 X 轴）
    if(cfg.type!=='Line' && cfg.type!=='Area'){
      var axis=document.createElementNS('http://www.w3.org/2000/svg','line'); axis.setAttribute('x1',drawPadL); axis.setAttribute('y1',padT+plotH); axis.setAttribute('x2',W-padR); axis.setAttribute('y2',padT+plotH); axis.setAttribute('stroke','#C9CDD4'); svg.appendChild(axis);
    }
    if(cfg.type==='Bar'){
      var yaxis=document.createElementNS('http://www.w3.org/2000/svg','line'); yaxis.setAttribute('x1',drawPadL); yaxis.setAttribute('y1',padT); yaxis.setAttribute('x2',drawPadL); yaxis.setAttribute('y2',padT+plotH); yaxis.setAttribute('stroke','#C9CDD4'); svg.appendChild(yaxis);
    }
    groups.forEach(function(g,i){
      if(cfg.type==='Bar'){ // 横向
        var band=plotH/n;
        var bh=band*0.55;
        var yy=padT+i*band+band*0.5;
        var r=document.createElementNS('http://www.w3.org/2000/svg','rect'); r.setAttribute('x',drawPadL); r.setAttribute('y',yy-bh/2); r.setAttribute('height',bh); r.setAttribute('width',drawPlotW*g.value/maxV); r.setAttribute('fill',colors[i%colors.length]); svg.appendChild(r);
        var lbl=document.createElementNS('http://www.w3.org/2000/svg','text'); lbl.setAttribute('x',drawPadL-6); lbl.setAttribute('y',yy+4); lbl.setAttribute('text-anchor','end'); lbl.setAttribute('font-size','10'); lbl.textContent=String(g.label).slice(0,10); svg.appendChild(lbl);
        if(cfg.showLabels!==false && g.value > (APP_SETTINGS.labelHideThreshold || 0)){
          var valLbl=document.createElementNS('http://www.w3.org/2000/svg','text'); valLbl.setAttribute('x',drawPadL+drawPlotW*g.value/maxV+4); valLbl.setAttribute('y',yy+4); valLbl.setAttribute('font-size','9'); valLbl.textContent=fmtNum(g.value); svg.appendChild(valLbl);
        }
      } else if(cfg.type==='Line'||cfg.type==='Area'){
        // 折线在循环后统一画
      } else {
        var x=drawPadL+i*bw+bw/2;
        var h=plotH*g.value/maxV, y=padT+plotH-h;
        var rect=document.createElementNS('http://www.w3.org/2000/svg','rect'); rect.setAttribute('x',x-bw*0.3); rect.setAttribute('y',y); rect.setAttribute('width',bw*0.6); rect.setAttribute('height',h); rect.setAttribute('fill',colors[i%colors.length]); svg.appendChild(rect);
        var lbl=document.createElementNS('http://www.w3.org/2000/svg','text'); lbl.setAttribute('x',x); lbl.setAttribute('y',padT+plotH+14); lbl.setAttribute('text-anchor','middle'); lbl.setAttribute('font-size','10'); lbl.textContent=String(g.label).slice(0,8); svg.appendChild(lbl);
        if(cfg.showLabels!==false && g.value > (APP_SETTINGS.labelHideThreshold || 0)){
          var valLbl=document.createElementNS('http://www.w3.org/2000/svg','text'); valLbl.setAttribute('x',x); valLbl.setAttribute('y',y-4); valLbl.setAttribute('text-anchor','middle'); valLbl.setAttribute('font-size','9'); valLbl.textContent=fmtNum(g.value); svg.appendChild(valLbl);
        }
      }
    });
    if(cfg.type==='Line'||cfg.type==='Area'){
      var pts=groups.map(function(g,i){ return [drawPadL+i*bw+bw/2, padT+plotH-plotH*g.value/maxV]; });
      if(cfg.type==='Area'){ var ar=document.createElementNS('http://www.w3.org/2000/svg','polygon'); ar.setAttribute('points', drawPadL+','+(padT+plotH)+' '+pts.map(function(p){return p[0]+','+p[1];}).join(' ')+' '+(drawPadL+drawPlotW)+','+(padT+plotH)); ar.setAttribute('fill','rgba(51,112,255,.15)'); svg.appendChild(ar); }
      var pl=document.createElementNS('http://www.w3.org/2000/svg','polyline'); pl.setAttribute('points',pts.map(function(p){return p[0]+','+p[1];}).join(' ')); pl.setAttribute('fill','none'); pl.setAttribute('stroke','#3370FF'); pl.setAttribute('stroke-width','2'); svg.appendChild(pl);
      if(cfg.showLabels!==false){
        pts.forEach(function(p,i){ if(groups[i].value > (APP_SETTINGS.labelHideThreshold || 0)){ var txt=document.createElementNS('http://www.w3.org/2000/svg','text'); txt.setAttribute('x',p[0]); txt.setAttribute('y',p[1]-6); txt.setAttribute('text-anchor','middle'); txt.setAttribute('font-size','9'); txt.setAttribute('fill','var(--text-2)'); txt.textContent=fmtNum(groups[i].value); svg.appendChild(txt); } });
      }
    }
  }
  function groupAggregate(rows, cfg){
    var field=cfg.dimensionField;
    if(cfg.timeField && (cfg.timeGroup&&cfg.timeGroup!=='None')) field=cfg.timeField;
    if(!field && cfg.timeGroup && cfg.timeGroup!=='None'){ var dateField=firstField(['Date','DateTime']); if(dateField) field=dateField.name; }
    if(!field) return rows.map(function(r,i){ return {label:'#'+i, value:Number(r.values[cfg.metricField]||0)||0}; });
    var map={};
    rows.forEach(function(r){
      var key;
      var dv=toDate(r.values[field]);
      if(dv){ key=fmtDate(dv); if(cfg.timeGroup==='Month') key=dv.getFullYear()+'-'+pad(dv.getMonth()+1); else if(cfg.timeGroup==='Year') key=dv.getFullYear(); else if(cfg.timeGroup==='Quarter') key=dv.getFullYear()+'Q'+Math.floor(dv.getMonth()/3+1); }
      else key=String(r.values[field]||'（空）');
      map[key]=(map[key]||0)+1;
    });
    // 聚合度量
    var out=Object.keys(map).map(function(k){
      var sub=rows.filter(function(r){ var dv=toDate(r.values[field]); var kk; if(dv){ kk=fmtDate(dv); if(cfg.timeGroup==='Month') kk=dv.getFullYear()+'-'+pad(dv.getMonth()+1); else if(cfg.timeGroup==='Year') kk=dv.getFullYear(); else if(cfg.timeGroup==='Quarter') kk=dv.getFullYear()+'Q'+Math.floor(dv.getMonth()/3+1); } else kk=String(r.values[field]||'（空）'); return kk===k; });
      return {label:k, value:aggregate(sub, cfg.metricField, cfg.aggregation)};
    });
    if(cfg.topN && out.length>cfg.topN){ out.sort(function(a,b){return b.value-a.value;}); var rest=out.slice(cfg.topN-1); out=out.slice(0,cfg.topN-1); var sum=rest.reduce(function(a,b){return a+b.value;},0); out.push({label:'其他', value:sum}); }
    return out;
  }

  function addRow(){
    // 表单视图：直接在左侧表单进入新建模式；其他视图打开右侧草稿面板
    if(activeViewType()==='Form'){ state.formNewRecord=true; renderForm(); return; }
    // 甘特视图：新建记录默认 开始=当前时间、结束=开始+默认时长（#305，时长可在甘特图配置中设置）
    if(activeViewType()==='Gantt'){
      var g=(activeView().ganttConfig)||{};
      if(g.startField){
        var now=new Date();
        var snapM=(now.getMinutes()>=30?30:0);
        var start=new Date(now.getFullYear(),now.getMonth(),now.getDate(),now.getHours(),snapM,0);
        var dur=(g.defaultDurationHours!=null?g.defaultDurationHours:4);
        var end=new Date(start.getTime()+dur*3600000);
        var sf=state.fields.find(function(x){return x.name===g.startField;});
        var ef=g.endField?state.fields.find(function(x){return x.name===g.endField;}):null;
        var prefill={};
        if(sf){ if(sf.type==='DateTime') prefill[g.startField]=fmtDate(start)+'T'+pad(start.getHours())+':'+pad(start.getMinutes()); else prefill[g.startField]=fmtDate(start); }
        if(ef){ if(ef.type==='DateTime') prefill[g.endField]=fmtDate(end)+'T'+pad(end.getHours())+':'+pad(end.getMinutes()); else prefill[g.endField]=fmtDate(end); }
        showDraftDetailPanel(prefill); return;
      }
    }
    // 日历视图：新建记录默认 开始=当前时间、结束=开始+日历默认时长（#335，如 17:10 + 30 分 → 17:40）
    if(activeViewType()==='Calendar'){
      var cCfg=(activeView().calendarConfig)||{};
      if(cCfg.dateField){
        var cNow=new Date();
        var cVals=calDraftValues(cCfg, cNow, cNow.getHours(), cNow.getMinutes());
        showDraftDetailPanel(cVals, cNow, cNow.getHours(), cNow.getMinutes()); return;
      }
    }
    showDraftDetailPanel({});
  }

  var _ctxAutoClose=null;
  function hideContextMenu(){ $('ctxMenu').classList.add('hidden'); disarmCtxAutoClose(); }
  function armCtxAutoClose(){
    if(_ctxAutoClose) return;
    function closeIfOpen(){ if(!$('ctxMenu').classList.contains('hidden')) hideContextMenu(); }
    function onDown(e){ if(!$('ctxMenu').contains(e.target)) closeIfOpen(); }
    function onKey(e){ if(e.key==='Escape') closeIfOpen(); }
    function onScroll(){ closeIfOpen(); }
    document.addEventListener('mousedown', onDown, true);
    document.addEventListener('keydown', onKey);
    window.addEventListener('scroll', onScroll, true);
    window.addEventListener('resize', onScroll);
    _ctxAutoClose={onDown:onDown,onKey:onKey,onScroll:onScroll};
  }
  function disarmCtxAutoClose(){
    if(!_ctxAutoClose) return;
    document.removeEventListener('mousedown', _ctxAutoClose.onDown, true);
    document.removeEventListener('keydown', _ctxAutoClose.onKey);
    window.removeEventListener('scroll', _ctxAutoClose.onScroll, true);
    window.removeEventListener('resize', _ctxAutoClose.onScroll);
    _ctxAutoClose=null;
  }

  // #379 导出整页截图前，临时解除仪表盘滚动锁定，使完整内容（含被 overflow:auto 裁掉的底部/右侧图表）进入文档流，
  //      配合 C# 端 CDP Page.captureScreenshot(captureBeyondViewport:true) 截取整页；导出后由 __relockDash 还原。
  window.__dashCaptureSaved = null;
  function __unlockDash(){
    var content=document.getElementById('content'); if(!content) return false;
    var dash=content.firstElementChild; if(!dash||!(dash.classList&&dash.classList.contains('dash-wrap'))) return false;
    window.__dashCaptureSaved={d:dash.getAttribute('style')||'', c:content.getAttribute('style')||''};
    dash.style.height='auto'; dash.style.maxHeight='none'; dash.style.overflow='visible';
    content.style.height='auto'; content.style.overflow='visible';
    return true;
  }
  function __relockDash(){
    var s=window.__dashCaptureSaved; if(!s) return;
    var content=document.getElementById('content');
    if(content) content.setAttribute('style', s.c);
    var dash=content&&content.firstElementChild;
    if(dash) dash.setAttribute('style', s.d);
    window.__dashCaptureSaved=null;
  }
  function getExportCrop(){
    var content=document.getElementById('content'); if(!content) return null;
    // 实际可滚动内容容器（图表真实绘制区，.dash-wrap overflow:auto），其 scrollWidth 为完整内容宽
    var inner=content.firstElementChild; if(!inner) inner=content;
    var r=inner.getBoundingClientRect();
    var LEFT=10, TOP=10; // #375/#379 左/上各内缩 10px
    var fullW=inner.scrollWidth||Math.round(r.width);
    // #379 底部以「最后一个图表卡片(.chart-box)底部 + 10px」为准；无图表时回退到完整内容底
    var boxes=inner.querySelectorAll('.chart-box');
    var bottomY;
    if(boxes && boxes.length){
      var lb=boxes[boxes.length-1].getBoundingClientRect();
      bottomY=lb.bottom;
    } else {
      bottomY=r.top + (inner.scrollHeight||Math.round(r.height));
    }
    var x=Math.max(0, Math.round(r.left)+LEFT);
    var y=Math.max(0, Math.round(r.top)+TOP);
    var w=Math.max(1, Math.round(fullW)-LEFT);   // #375 右侧以完整内容右边界为准（不变）
    var h=Math.max(1, Math.round(bottomY)+10 - Math.round(r.top) - TOP); // #379 底部 = 最后图表底 + 10
    return {x:x,y:y,w:w,h:h};
  }

  // ───────── 配置保存 ─────────
  function saveConfig(){
    if(!state.config) return;
    var cfg=JSON.parse(JSON.stringify(state.config));
    // 同步当前活动视图的可见字段、排序、筛选（#366 文件级绑定）
    var av=cfg.views.find(function(v){return v.viewId===state.activeViewId;}) || cfg.views[0];
    if(av){ av.visibleFields=state.visibleFields.slice(); av.sort=[]; if(state.sortField&&state.sortOrder) av.sort.push({field:state.sortField,order:state.sortOrder}); av.filter=state.filter||''; av.fieldFilter=state.fieldFilter||null; }
    // 同步各视图的专属配置（从 state.views 回写）；不存在则新增，已删除则移除
    state.views.forEach(function(sv){
      var cv=cfg.views.find(function(x){return x.viewId===sv.viewId;});
      if(cv){
        cv.viewType=sv.viewType; cv.viewName=sv.viewName;
        cv.groupBy=sv.groupBy; cv.cardMeta=sv.cardMeta; cv.calendarConfig=sv.calendarConfig; cv.ganttConfig=sv.ganttConfig; cv.chartConfig=sv.chartConfig; cv.dashboardConfig=sv.dashboardConfig; cv.visibleFields=sv.visibleFields; cv.summary=sv.summary; cv.showSummary=sv.showSummary; cv.summaryPosition=sv.summaryPosition;
      } else {
        // 另存为新视图等产生的新视图：追加进落盘配置
        cfg.views.push(JSON.parse(JSON.stringify(sv)));
      }
    });
    // 移除已在 state.views 中删除的视图（如删除非默认视图）
    cfg.views=cfg.views.filter(function(cv){ return state.views.some(function(sv){ return sv.viewId===cv.viewId; }); });
    api.call('saveConfig',{json:JSON.stringify(cfg), saveLocation: APP_SETTINGS.configSaveLocation||'both'}).catch(function(err){ toast('配置保存失败：'+err.message); });
  }

    '  · 周起始日、月视图最大任务数、默认时长在“软件设置”中配置。\n'+
    '  · 拖动任务块可调整开始/结束日期；日视图和周视图支持精确到时间。\n\n'+
    '七、甘特视图（重点：开始/结束日期）\n'+
    '说明：以横向时间轴展示任务进度与排期，支持年 / 季度 / 月 / 周 / 日 维度切换。\n'+
    '关键字段：\n'+
    '  · 开始日期字段：Date 或 DateTime 类型，决定任务条起点。\n'+
    '  · 结束日期字段：Date 或 DateTime 类型，决定任务条终点。\n'+
    '  · 分组字段 / 进度字段（可选）：用于分组显示与百分比进度条。\n'+
    '重点设定：\n'+
    '  · 在“视图设置 / 甘特设置”中指定开始日期与结束日期字段。\n'+
    '  · 显示边界可选择“飞书模式（按任务边界）”或“项目边界外扩 N 天”。\n'+
    '  · 拖拽任务条 / 边框可调整起止日期与时长（移动=平移、时长不变；拉伸=改起止、时长变）。\n'+
    '  · 可视化调整保存模式（软件设置 ⚙）：默认“自动（拖完即保存）”；切到“手动（需手动保存）”后，拖完仅暂存于内存，右下角出现“保存调整”条，手动点“保存调整”才写回工作表，点“放弃”可还原；切换视图或关闭软件前有未保存调整会弹确认。\n\n'+
    '八、仪表盘视图\n'+
    '说明：汇总展示多个统计图表卡片，支持柱形图、折线图、饼图、环形图、KPI 卡等。\n'+
    '关键字段：维度字段（横轴/分类）、数值字段（纵轴/汇总）。\n'+
    '重点设定：每张卡片可单独设置图表类型、标题、主题色；“图表控制开关”控制右上角设置/删除按钮的显隐；右键卡片可导出 PNG 图片。\n\n'+
    '九、图表视图\n'+
    '说明：单张统计图表的独立视图，用于聚焦某一分析维度。\n'+
    '关键字段：同仪表盘——维度字段 + 数值字段。\n'+
    '重点设定：可设置时间分组（按日/周/月/季/年）与隐藏小值标签阈值。\n\n'+
    '十、常见问题速查\n'+
    '  · 日期时间格式：日历 / 甘特视图优先识别 DateTime 类型字段中的“日期时间”。\n'+
    '  · 字段未显示：检查“字段开关”是否勾选该字段。\n'+
    '  · 配置不生效：点击顶部“刷新”重新读取工作簿，或在“设置”中切换数据源。\n'+
    '  · 异常排查：在“设置 → 关于本软件”中核对版本号与部署时间。\n';

  function showHelp(){
    var ov=document.createElement('div'); ov.className='overlay';
    var modal=document.createElement('div'); modal.className='modal';
    modal.style.maxWidth='min(780px, 94vw)';
    modal.style.width='min(780px, 94vw)';
    modal.innerHTML='<div class="modal-head"><span>使用帮助</span><button class="btn sm" id="xHelp">✕</button></div>';
    var body=document.createElement('div'); body.className='modal-body';
    body.style.padding='16px 20px';
    var ta=document.createElement('textarea');
    ta.className='help-text';
    ta.readOnly=true;
    ta.value=HELP_TEXT;
    ta.style.cssText='width:100%;height:min(560px, 64vh);resize:none;border:1px solid var(--border);border-radius:6px;padding:16px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.85;background:var(--bg-2);color:var(--text-1);outline:none;';
    body.appendChild(ta);
    modal.appendChild(body);
    var foot=document.createElement('div'); foot.className='modal-foot';
    var copy=document.createElement('button'); copy.className='btn primary'; copy.innerHTML='<span class="ic">'+icon('copy')+'</span>复制全部';
    copy.addEventListener('click', function(){
      ta.select();
      try{
        var ok=document.execCommand('copy');
        toast(ok ? '帮助内容已复制到剪贴板' : '复制失败，请手动选中后复制');
      }catch(err){ toast('复制失败：'+err.message); }
    });
    foot.appendChild(copy);
    var close=document.createElement('button'); close.className='btn'; close.textContent='关闭'; close.addEventListener('click', function(){ ov.remove(); });
    foot.appendChild(close); modal.appendChild(foot);
    ov.appendChild(modal); ov.addEventListener('click', function(e){ if(e.target===ov) ov.remove(); });
    document.getElementById('overlayHost').appendChild(ov);
    modal.querySelector('#xHelp').addEventListener('click', function(){ ov.remove(); });
  }

  // ───────── Ribbon 回调 ─────────
  window.__mtReload=function(){ if(state.sheet&&state.table) openTable(state.sheet, state.table); };
  window.__mtSave=function(){ saveConfig(); toast('配置已保存'); };

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', function(){ waitReady(start); }); else waitReady(start);
})();
</script>
</body>
